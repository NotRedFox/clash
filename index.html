<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#101014">
<title>Chaos Draft</title>
<style>
:root{
  --bg:#101014; --surface:#18181E; --line:#26262F; --line2:#33333F;
  --ink:#F0F0F2; --mid:#9A9AA6; --low:#61616E; --acc:#FFD400;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg)}
body{color:var(--ink);
  font:400 15px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  padding:calc(12px + env(safe-area-inset-top)) 0 calc(24px + env(safe-area-inset-bottom));
  max-width:460px;margin:0 auto;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--acc);outline-offset:-2px}

.tabs{display:flex;border-bottom:1px solid var(--line);margin-bottom:2px}
.tabs button{flex:1;min-height:46px;font-size:.72rem;font-weight:700;letter-spacing:.08em;
  text-transform:uppercase;color:var(--low);border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--acc)}

.eyebrow{font-size:.66rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;
  color:var(--low);padding:18px 16px 8px}

.list{border-top:1px solid var(--line)}
.item{border-bottom:1px solid var(--line)}
.item.on{background:var(--surface);box-shadow:inset 3px 0 0 var(--acc)}
.head{display:flex;align-items:center;gap:12px;padding:0 16px;min-height:50px}
.nm{flex:1;min-width:0;text-align:left;font-size:.9rem;font-weight:600;padding:14px 0;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sc{font-size:.9rem;font-weight:800;font-variant-numeric:tabular-nums;min-width:26px;text-align:right}
.add{width:30px;height:30px;flex:none;border:1px solid var(--line2);color:var(--mid);
  font-size:1rem;line-height:1;display:grid;place-items:center}
.add.on{background:var(--acc);border-color:var(--acc);color:#101014;font-weight:800}

.tbar{display:flex;height:5px;margin:0 16px 10px}
.tbar div{height:100%}
.tlab{display:flex;gap:12px;padding:0 16px 12px;font-size:.64rem;color:var(--mid);
  font-variant-numeric:tabular-nums}
.tlab span{display:flex;align-items:center;gap:4px}
.tlab i{width:7px;height:7px;display:block}

.exp{padding:2px 16px 14px;display:flex;flex-direction:column;gap:11px}
.mod{display:grid;grid-template-columns:3px 1fr auto;gap:11px;align-items:start}
.bar{align-self:stretch}
.mr{font-size:.62rem;font-weight:700;letter-spacing:.1em;color:var(--low);text-transform:uppercase}
.me{font-size:.84rem;color:#C9C9D2;margin-top:2px}
.mv{font-size:.78rem;font-weight:700;font-variant-numeric:tabular-nums;color:var(--mid)}

.srch{width:100%;min-height:44px;padding:0 16px;background:var(--surface);border:0;
  border-top:1px solid var(--line);border-bottom:1px solid var(--line);
  color:var(--ink);font:inherit;font-size:.9rem}
.srch:focus{outline:none}
.srch::placeholder{color:var(--low)}

.stat{display:flex;align-items:flex-end;justify-content:space-between;padding:6px 16px 18px}
.big{font-size:2.6rem;font-weight:800;line-height:.9;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.statLbl{font-size:.66rem;letter-spacing:.1em;text-transform:uppercase;color:var(--low)}
.wave{display:grid;grid-template-columns:14px 1fr 34px;gap:11px;align-items:center;
  padding:9px 16px;border-bottom:1px solid var(--line)}
.wn{font-size:.72rem;font-weight:700;color:var(--mid);font-variant-numeric:tabular-nums}
.trk{height:6px;background:var(--surface)}
.fil{height:100%;background:var(--acc);transition:width .25s}
.wp{font-size:.78rem;font-weight:700;text-align:right;font-variant-numeric:tabular-nums}
.chips{display:flex;flex-wrap:wrap;gap:4px;padding:14px 16px}
.chips button{background:var(--surface);border:1px solid var(--line);padding:7px 10px;
  font-size:.75rem;color:var(--mid)}

.pk{border-bottom:1px solid var(--line);padding:14px 16px}
.pk.win{background:var(--surface);box-shadow:inset 3px 0 0 var(--acc)}
.pkTop{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.refimg{width:38px;height:46px;object-fit:contain;background:#000;flex:none;margin-right:9px;
  vertical-align:middle;border:1px solid var(--line2)}
.pkNm{font-size:1.05rem;font-weight:700;letter-spacing:-.01em}
.rk{display:inline-block;min-width:20px;margin-right:8px;color:var(--low);
  font-size:.8rem;font-weight:700;font-variant-numeric:tabular-nums}
.pkSc{font-size:1.05rem;font-weight:800;font-variant-numeric:tabular-nums;color:var(--acc)}
.tag{font-size:.6rem;font-weight:800;letter-spacing:.1em;color:var(--acc);display:block;margin-bottom:4px}
.pkMods{display:flex;flex-direction:column;gap:7px}
.pkMod{display:grid;grid-template-columns:3px 1fr auto;gap:10px;align-items:center}

.cta{display:grid;place-items:center;width:100%;min-height:50px;background:var(--acc);
  color:#101014;font-weight:800;font-size:.85rem;letter-spacing:.04em;text-transform:uppercase}
.ghost{display:block;width:100%;min-height:44px;border-top:1px solid var(--line);
  color:var(--mid);font-size:.8rem}
.wrapOuter{text-align:center;padding:8px 0}
#wrap{position:relative;display:inline-block;line-height:0}
#shot{max-height:30vh;max-width:100%;width:auto;display:block}
.mk{position:absolute;inset:0;pointer-events:none}
.mk div{position:absolute;border:2px solid var(--acc);transform:translate(-50%,-50%)}
.mk b{position:absolute;top:-8px;left:-2px;background:var(--acc);color:#101014;
  font-size:.58rem;padding:0 4px;white-space:nowrap}
.ask{border-top:2px solid var(--acc);background:var(--surface)}
.askH{font-size:.8rem;font-weight:700;padding:14px 16px 0}
.opts{max-height:210px;overflow-y:auto}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:10px 12px}
.grid button{display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 2px;
  background:var(--bg);border-radius:4px}
.grid img{width:100%;max-width:56px;aspect-ratio:3/4;object-fit:contain}
.pairs{display:flex;gap:14px;flex-wrap:wrap}
.pair{display:flex;gap:4px}
.pair img,.ids img{width:54px;height:72px;object-fit:cover;background:#000;display:block}
.pair span,.ids span{font-size:.55rem;color:var(--low);display:block;margin-top:3px;text-align:center}
.ids{display:flex;gap:10px;flex-wrap:wrap}
.seg{display:flex;border-bottom:1px solid var(--line)}
.seg button{flex:1;min-height:40px;font-size:.7rem;font-weight:700;letter-spacing:.06em;
  text-transform:uppercase;color:var(--low)}
.seg button[aria-pressed="true"]{color:var(--ink);background:var(--surface)}
.diag{padding:0 16px 12px;display:flex;flex-direction:column;gap:10px}
.diagCol{border-top:1px solid var(--line);padding-top:8px}
.diagH{font-size:.62rem;letter-spacing:.08em;text-transform:uppercase;color:var(--low);margin-bottom:5px}
.diagCol div{display:flex;justify-content:space-between;font-size:.7rem;color:var(--mid);padding:1px 0}
.diagCol b{color:var(--ink);font-variant-numeric:tabular-nums}
.grid span{font-size:.6rem;color:var(--mid);text-align:center;line-height:1.15}
.opts button{display:block;width:100%;text-align:left;padding:11px 16px;font-size:.85rem;
  border-bottom:1px solid var(--line)}

.meta{font-size:.7rem;color:var(--low);padding:16px}
.key{display:flex;flex-wrap:wrap;gap:10px;padding:16px;font-size:.68rem;color:var(--mid)}
.key span{display:flex;align-items:center;gap:5px}
.key i{width:9px;height:9px;display:block}

@media (max-width:350px){ body{font-size:14px} }
@media (prefers-reduced-motion:reduce){ .fil{transition:none} }
</style>
</head>

/* Compare whole card to whole card.

   Both the screenshot card and the reference image get squashed into
   the same GW x GH grid of average colour, so the two descriptions
   cover the same thing regardless of the source resolution or aspect.
   Comparing square crops was the earlier mistake: a square taken from
   a portrait card keeps a different slice depending on the source
   shape, so the two sides were never describing the same region. */
var GW = 24, GH = 32;
var CARD_ASPECT = 0.81;

/* Which part of the in-game card is artwork, as fractions of the card

var ART_X0 = 0.07, ART_X1 = 0.93, ART_Y0 = 0.04, ART_Y1 = 0.76;

/* The elixir drop, as fractions of the card box. */
var EL_X0 = 0.30, EL_X1 = 0.70, EL_Y0 = 0.79, EL_Y1 = 1.00;
var DGW = 14, DGH = 18;

function sampleRGBA(img, x, y, w, h, gw, gh){
  var c=document.createElement("canvas"); c.width=gw; c.height=gh;
  var g=c.getContext("2d",{willReadFrequently:true});
  g.clearRect(0,0,gw,gh);
  g.drawImage(img, x, y, w, h, 0, 0, gw, gh);
  return g.getImageData(0,0,gw,gh).data;
}

/* ── artwork descriptors ───────────────────────────────────────
   Three independent views of the same crop. Pixel colour catches
   palette, edges catch shape, and the row/column profile catches
   layout. Cards that fool one rarely fool all three. */
function describe(d, withMask){
  var px=[], mask=[], lum=[];
  for(var i=0;i<GW*GH;i++){
    var r=d[i*4], g=d[i*4+1], b=d[i*4+2], a=d[i*4+3];
    px.push(r,g,b);
    lum.push(0.299*r + 0.587*g + 0.114*b);
    if(withMask) mask.push(a > 140 ? 1 : 0);
  }
  /* edge strength per cell */
  var edge=[];
  for(var y=0;y<GH;y++){
    for(var x=0;x<GW;x++){
      var i0=y*GW+x;
      var gx = (x<GW-1 ? lum[i0+1] : lum[i0]) - lum[i0];
      var gy = (y<GH-1 ? lum[i0+GW] : lum[i0]) - lum[i0];
      edge.push(Math.sqrt(gx*gx + gy*gy));
    }
  }
  return { p:px, m:withMask?mask:null, e:edge, l:lum };
}

function refSig(img){
  var W=img.naturalWidth, H=img.naturalHeight;
  var s = fitSig(img, W*ART_X0, H*ART_Y0, W*(ART_X1-ART_X0), H*(ART_Y1-ART_Y0));
  s.w=W; s.h=H;
  s.m = []; for(var i=0;i<GW*GH;i++) s.m.push(1);
  return s;
}

function shotSig(img, x, y, w, h){
  return describe(sampleRGBA(img, x, y, w, h, GW, GH), false);
}

/* Mean-corrected colour difference over the masked cells. */
function colourDist(shot, ref){
  if(!ref||!ref.m) return 1e9;
  var n=0, i, k, sm=[0,0,0], rm=[0,0,0];
  for(i=0;i<GW*GH;i++){
    if(!ref.m[i]) continue;
    n++;
    for(k=0;k<3;k++){ sm[k]+=shot.p[i*3+k]; rm[k]+=ref.p[i*3+k]; }
  }
  if(n<40) return 1e9;
  for(k=0;k<3;k++){ sm[k]/=n; rm[k]/=n; }
  var s=0;
  for(i=0;i<GW*GH;i++){
    if(!ref.m[i]) continue;
    for(k=0;k<3;k++){
      var d=(shot.p[i*3+k]-sm[k])-(ref.p[i*3+k]-rm[k]);
      s+=d*d;
    }
  }
  return Math.sqrt(s/(n*3));
}

/* Edge maps, each normalised so overall contrast does not matter. */
function edgeDist(shot, ref){
  var n=0,i,se=0,re=0;
  for(i=0;i<GW*GH;i++){ if(!ref.m[i]) continue; n++; se+=shot.e[i]; re+=ref.e[i]; }
  if(n<40) return 1e9;
  se=(se/n)||1; re=(re/n)||1;
  var s=0;
  for(i=0;i<GW*GH;i++){
    if(!ref.m[i]) continue;
    var d=(shot.e[i]/se)-(ref.e[i]/re);
    s+=d*d;
  }
  return Math.sqrt(s/n)*40;
}

/* Where the bright and dark bands sit, row by row and column by
   column. Cheap, and good at separating similar palettes. */
function profileDist(shot, ref){
  var rows=[[],[]], cols=[[],[]], x, y, i, n;
  for(y=0;y<GH;y++){
    var a=0,b=0,c=0;
    for(x=0;x<GW;x++){ i=y*GW+x; if(!ref.m[i]) continue; a+=shot.l[i]; b+=ref.l[i]; c++; }
    if(c){ rows[0].push(a/c); rows[1].push(b/c); }
  }
  for(x=0;x<GW;x++){
    var a2=0,b2=0,c2=0;
    for(y=0;y<GH;y++){ i=y*GW+x; if(!ref.m[i]) continue; a2+=shot.l[i]; b2+=ref.l[i]; c2++; }
    if(c2){ cols[0].push(a2/c2); cols[1].push(b2/c2); }
  }
  function cmp(u,v){
    if(!u.length) return 0;
    var mu=0,mv=0,k;
    for(k=0;k<u.length;k++){ mu+=u[k]; mv+=v[k]; }
    mu/=u.length; mv/=v.length;
    var s=0;
    for(k=0;k<u.length;k++){ var d=(u[k]-mu)-(v[k]-mv); s+=d*d; }
    return Math.sqrt(s/u.length);
  }
  return (cmp(rows[0],rows[1]) + cmp(cols[0],cols[1])) / 2;
}

function artScore(shot, ref){
  if(!ref || !ref.m || !ref.e || !ref.l) return 1e9;
  return colourDist(shot,ref) + edgeDist(shot,ref)*0.8 + profileDist(shot,ref)*0.6;
}

/* Comparing two screenshot crops, no mask needed. */
function shotDist(a,b){
  var s=0, n=GW*GH*3;
  for(var i=0;i<n;i++){ var d=a.p[i]-b.p[i]; s+=d*d; }
  return Math.sqrt(s/n);
}

/* ── elixir digit ──────────────────────────────────────────────
   No OCR and no redrawn fonts. The app collects real digit crops
   from your own screenshots: whenever a card is confirmed, its cost
   is known, so the digit is filed under that cost. */
var DIG_KEY = "chaosElixirDigits_v2";
var DIGLIB = (function(){
  try { return JSON.parse(localStorage.getItem(DIG_KEY)) || {}; }
  catch(e){ return {}; }
})();
function saveDigits(){
  try { localStorage.setItem(DIG_KEY, JSON.stringify(DIGLIB)); } catch(e){}

/* White digit against the saturated magenta drop. */
function digitMask(img, cx, cy, w, h){
  var x = cx - w/2 + w*EL_X0, y = cy - h/2 + h*EL_Y0;
  var d = sampleRGBA(img, x, y, w*(EL_X1-EL_X0), h*(EL_Y1-EL_Y0), DGW, DGH);
  var m=[], on=0;
  for(var i=0;i<DGW*DGH;i++){
    var r=d[i*4], g=d[i*4+1], b=d[i*4+2];
    var white = r>165 && g>150 && b>165 && Math.abs(r-b)<70;
    m.push(white?1:0); if(white) on++;
  }
  if(on < 6 || on > DGW*DGH*0.62) return null;
  return m;
}
function maskDist(a,b){
  var diff=0;
  for(var i=0;i<a.length;i++) if(a[i]!==b[i]) diff++;
  return diff/a.length;
}

/* Best cost for this digit, or null when the library cannot say. */
function readCost(mask){
  if(!mask) return null;
  var best=null, bd=1e9, second=1e9;
  for(var cst in DIGLIB){
    if(!DIGLIB.hasOwnProperty(cst)) continue;
    var arr=DIGLIB[cst];
    for(var i=0;i<arr.length;i++){
      var d=maskDist(mask, arr[i]);
      if(d<bd){ second=bd; bd=d; best=+cst; }
      else if(d<second) second=d;
    }
  }
  if(best===null) return null;
  if(bd > 0.22) return null;              /* nothing close enough */
  if(second - bd < 0.05) return null;     /* two costs equally close */
  return best;
}

function learnDigit(cost, mask){
  if(!mask || !cost) return;
  var k=String(cost);
  if(!DIGLIB[k]) DIGLIB[k]=[];
  for(var i=0;i<DIGLIB[k].length;i++) if(maskDist(mask, DIGLIB[k][i]) < 0.05) return;
  DIGLIB[k].push(mask);
  if(DIGLIB[k].length > 8) DIGLIB[k].shift();
  saveDigits();
}


/* Artwork similarity across several views of the same card, taken
   from the original resolution crop rather than from one small
   representation. The artwork view carries the most weight. */
var SCORE_VIEWS = [
  [ART_Y0, ART_Y1-ART_Y0, ART_X0, 1.0],   /* artwork  */
  [0.00,   0.55,          0.06,   0.5],   /* upper    */
  [0.10,   0.70,          0.12,   0.5],   /* centre   */
  [0.00,   1.00,          0.04,   0.4]    /* full     */
];

function artworkScore(img, X, Y, W, H, ref){
  var total=0, wsum=0;
  for(var i=0;i<SCORE_VIEWS.length;i++){
    var v=SCORE_VIEWS[i];
    var sg = fitSig(img, X + W*v[2], Y + H*v[0], W*(1-v[2]*2), H*v[1]);
    var rv = ref.views && ref.views[i];
    if(!rv) continue;
    total += (colourDist(sg, rv) + edgeDist(sg, rv)*0.8) * v[3];
    wsum  += v[3];
  }
  return wsum ? total/wsum : 1e9;
}

function refViews(img){
  var W=img.naturalWidth, H=img.naturalHeight, out=[];
  for(var i=0;i<SCORE_VIEWS.length;i++){
    var v=SCORE_VIEWS[i];
    var s = fitSig(img, W*v[2], H*v[0], W*(1-v[2]*2), H*v[1]);
    s.m=[]; for(var j=0;j<GW*GH;j++) s.m.push(1);
    out.push(s);
  }
  return out;
}

/* Turn raw distances into 0..1 where 1 is best, so two very
   different measures can be combined fairly. */
function normalise(map, keys, lowerIsBetter){
  var lo=Infinity, hi=-Infinity;
  keys.forEach(function(k){
    var v=map[k]; if(v===undefined || !isFinite(v)) return;
    if(v<lo) lo=v; if(v>hi) hi=v;
  });
  var out={};
  keys.forEach(function(k){
    var v=map[k];
    if(v===undefined || !isFinite(v) || hi===lo){ out[k]=0; return; }
    out[k] = lowerIsBetter ? (hi-v)/(hi-lo) : (v-lo)/(hi-lo);
  });
  return out;
}


/* ── template registration ──────────────────────────────────────
   For small cards, keypoints are too few to be reliable. Template
   matching uses every pixel instead: normalise the crop to the
   reference shape, then measure luminance, colour and edge
   difference, allowing a little slack in position and scale.

   Coarse to fine: every reference is scored cheaply at 16x20, then
   only the closest are rescored at 32x40. */
var TC_W=16, TC_H=20, TF_W=32, TF_H=40;

function template(img, x, y, w, h, tw, th){
  var c=document.createElement("canvas"); c.width=tw; c.height=th;
  var g=c.getContext("2d",{willReadFrequently:true});
  g.fillStyle="#000"; g.fillRect(0,0,tw,th);
  g.drawImage(img, x, y, w, h, 0, 0, tw, th);
  var d=g.getImageData(0,0,tw,th).data;
  var rgb=new Float32Array(tw*th*3), lum=new Float32Array(tw*th);
  var mr=0,mg=0,mb=0,ml=0, n=tw*th;
  for(var i=0;i<n;i++){
    var r=d[i*4], gg=d[i*4+1], b=d[i*4+2];
    rgb[i*3]=r; rgb[i*3+1]=gg; rgb[i*3+2]=b;
    lum[i]=0.299*r+0.587*gg+0.114*b;
    mr+=r; mg+=gg; mb+=b; ml+=lum[i];
  }
  mr/=n; mg/=n; mb/=n; ml/=n;
  /* remove overall brightness and tint, so lighting differences
     between an icon and an in-game render do not dominate */
  for(i=0;i<n;i++){
    rgb[i*3]-=mr; rgb[i*3+1]-=mg; rgb[i*3+2]-=mb;
    lum[i]-=ml;
  }
  var edge=new Float32Array(n);
  for(var y2=0;y2<th;y2++){
    for(var x2=0;x2<tw;x2++){
      var i0=y2*tw+x2;
      var gx=(x2<tw-1?lum[i0+1]:lum[i0])-lum[i0];
      var gy=(y2<th-1?lum[i0+tw]:lum[i0])-lum[i0];
      edge[i0]=Math.sqrt(gx*gx+gy*gy);
    }
  }
  return { rgb:rgb, lum:lum, edge:edge, n:n };
}

function tplDist(a, b){
  var s1=0, s2=0, i;
  for(i=0;i<a.n*3;i++){ var d1=a.rgb[i]-b.rgb[i]; s1+=d1*d1; }
  for(i=0;i<a.n;i++){ var d2=a.edge[i]-b.edge[i]; s2+=d2*d2; }
  return Math.sqrt(s1/(a.n*3)) + Math.sqrt(s2/a.n)*0.7;
}

function refTemplates(img){
  var W=img.naturalWidth, H=img.naturalHeight;
  return {
    coarse: template(img, 0, 0, W, H, TC_W, TC_H),
    fine:   template(img, 0, 0, W, H, TF_W, TF_H)
  };
}

/* Small alignment offsets, as fractions of the card box. */
var TPL_SHIFTS = [[0,0,1],[ -0.04,0,1],[0.04,0,1],[0,-0.04,1],[0,0.04,1],
                  [0,0,0.94],[0,0,1.06]];

function templateRank(img, X, Y, W, H, names){
  var coarse={}, i, k;
  var shots=[], shotsF=[];
  TPL_SHIFTS.forEach(function(s){
    var w2=W*s[2], h2=H*s[2];
    var x=X+W*s[0]+(W-w2)/2, y=Y+H*s[1]+(H-h2)/2;
    shots.push(template(img, x, y, w2, h2, TC_W, TC_H));
    shotsF.push([x,y,w2,h2]);
  });

  names.forEach(function(nm){
    var t=REF[nm] && REF[nm].tpl;
    if(!t){ coarse[nm]=1e9; return; }
    var best=1e9;
    for(i=0;i<shots.length;i++){
      var d=tplDist(shots[i], t.coarse);
      if(d<best) best=d;
    }
    coarse[nm]=best;
  });

  var short = names.slice().sort(function(a,b){ return coarse[a]-coarse[b]; }).slice(0,14);
  var fine={};
  short.forEach(function(nm){
    var t=REF[nm].tpl, best=1e9;
    for(i=0;i<shotsF.length;i++){
      var r=shotsF[i];
      var st=template(img, r[0], r[1], r[2], r[3], TF_W, TF_H);
      var d=tplDist(st, t.fine);
      if(d<best) best=d;
    }
    fine[nm]=best;
  });

  var out={};
  names.forEach(function(nm){
    out[nm] = fine[nm]!==undefined ? fine[nm] : coarse[nm]*2 + 200;
  });
  return out;
}

/* ── one recognition path ──────────────────────────────────────── */
function recognise(cx, cy, w, hh){
  function crop(kx, ky){
    var w2=w*kx, h2=hh*ky;
    var x = cx - w2/2 + w2*ART_X0;
    var y = cy - h2/2 + h2*ART_Y0;
    return shotSig(S.img, x, y, w2*(ART_X1-ART_X0), h2*(ART_Y1-ART_Y0));
  }
  var mySig = crop(1,1);
  var dmask = digitMask(S.img, cx, cy, w, hh);
  var cost  = readCost(dmask);

  /* Screenshot library: crops of cards you have already confirmed,
     taken from your own screenshots. Same frame, same device, same
     rendering, so this is the closest thing to like-for-like. */
  var seen = {};
  for(var k in S.lib){
    if(!S.lib.hasOwnProperty(k)) continue;
    var bestSeen = 1e9;
    for(var i=0;i<S.lib[k].length;i++){
      var e=S.lib[k][i];
      if(e && e.p) bestSeen = Math.min(bestSeen, shotDist(mySig, e));
    }
    if(bestSeen < 1e9) seen[k] = bestSeen;
  }
  /* a very close screenshot match is decisive on its own */
  var sureName=null, sureD=1e9;
  for(var sn in seen){ if(seen[sn]<sureD){ sureD=seen[sn]; sureName=sn; } }
  if(sureName && sureD < 26){
    return { sig:mySig, dmask:dmask, cost:cost, name:sureName,
             ranked:[sureName], conf:1, scores:{}, why:"screenshot" };
  }

  /* cost is a hard filter when it read cleanly, otherwise everything */
  /* Cost filtering is off. One misread digit removes the correct card
     before the matcher gets a chance, and a single bad read was being
     applied to all three slots. */
  var pool = Object.keys(REF);
  Object.keys(seen).forEach(function(nm){ if(pool.indexOf(nm)===-1) pool.push(nm); });

  /* Feature matching is the identity signal. Geometrically consistent
     matches count most, then raw match count, then match quality.
     Higher is better here, so scores are negated to keep the rest of
     the pipeline sorting ascending. */
  var A = featureSet(S.img, cx-w/2, cy-hh/2, w, hh);
  var kpCount = A.pts.length;
  var featRaw={}, artRaw={}, detail={};
  pool.forEach(function(nm){
    var rf = refFeat(nm);
    var m = rf ? matchDetail(A, rf) : {good:0,geo:0,quality:0,cands:0};
    detail[nm] = m;
    featRaw[nm] = m.geo*0.65 + m.good*0.20 + m.quality*100*0.15;
    artRaw[nm]  = REF[nm] ? artworkScore(S.img, cx-w/2, cy-hh/2, w, hh, REF[nm]) : 1e9;
  });

  /* Small cards go to template registration, which uses every pixel
     rather than a handful of keypoints. Full size cards stay on
     feature matching, which is accurate for them. */
  var tiny = w < 70;
  if(tiny){
    var tplRaw = templateRank(S.img, cx-w/2, cy-hh/2, w, hh, pool);
    var tN = normalise(tplRaw, pool, true);
    var fN2 = normalise(featRaw, pool, false);
    var sc={};
    pool.forEach(function(nm){
      sc[nm] = -(tN[nm]*0.75 + fN2[nm]*0.25);
      detail[nm].combined = -sc[nm];
      detail[nm].art = tplRaw[nm];
    });
    var rankedT = pool.slice().sort(function(a,b){ return sc[a]-sc[b]; });
    var cT = 0;
    if(rankedT[0] && rankedT[1]){
      cT = Math.max(0, Math.min(1,
        (detail[rankedT[0]].combined - detail[rankedT[1]].combined) * 5));
    }
    return { sig:mySig, dmask:dmask, cost:cost, name:rankedT[0]||null,
             ranked:rankedT.slice(0,8), conf:cT, scores:sc, detail:detail,
             pool:pool.length, kp:kpCount, why:"template" };
  }

  /* Feature matching is the primary signal. Artwork similarity only
     separates candidates whose geometry is genuinely tied, and can
     never overturn a strong geometric match. */
  var fN = normalise(featRaw, pool, false);
  var aN = normalise(artRaw,  pool, true);
  var scores={};
  pool.forEach(function(nm){
    var g = detail[nm].geo || 0;
    /* a confident geometric match stands on its own */
    var tie = g < 5 ? 0.25 : 0.06;
    scores[nm] = -(fN[nm]*(1-tie) + aN[nm]*tie);
    detail[nm].combined = -scores[nm];
    detail[nm].art = artRaw[nm];
  });

  var ranked = pool.slice().sort(function(a,b){
    if(scores[a] !== scores[b]) return scores[a]-scores[b];
    return (detail[b].geo||0) - (detail[a].geo||0);
  });

  /* Accept only clear winners. Weak or contested matches report low
     confidence rather than guessing. */
  var conf = 0, top = ranked[0], second = ranked[1];
  if(top && detail[top]){
    var c1 = detail[top].combined || 0;
    var c2 = (second && detail[second]) ? (detail[second].combined||0) : 0;
    conf = Math.max(0, Math.min(1, (c1 - c2) * 4));
  }

  return { sig:mySig, dmask:dmask, cost:cost, name:ranked[0]||null,
           ranked:ranked.slice(0,8), conf:conf, scores:scores,
           detail:detail, pool:pool.length, kp:kpCount, why:"feature" };
}

function loadRefs(cb){
  /* Anyone who asks while loading is already under way gets queued.
     Returning early without calling back was leaving the scan with
     nothing to do, which looked like the matcher failing. */
  if (refState.running){ if(cb) refWaiting.push(cb); return; }
  if (Object.keys(REF).length){ if(cb) cb(); return; }
  try {
    var cached = JSON.parse(localStorage.getItem(REF_KEY));
    var sample = cached && cached[Object.keys(cached)[0]];
    var usable = sample && sample.p && sample.m && sample.e && sample.l
                 && sample.p.length === GW*GH*3;
    if (cached && usable) {
      REF = cached;
      refState.done = Object.keys(REF).length;
      refState.total = refState.done;
      cb(); return;
    }
  } catch(e){}

  refState.running = true;
  var names = Object.keys(SLUG);
  refState.total = names.length;

  names.forEach(function(name){
    var i = 0;
    function attempt(){
      if (i >= ART.length){
        refState.failed++;
        refState.why = refState.why || ("404: cards/"+SLUG[name]+".png");
        tick(); return;
      }
      var img = new Image();
      var url = ART[i].replace("{s}", SLUG[name]);
      /* same-origin images need no CORS attribute, and asking for one
         makes the load fail if the host does not answer with it */
      if (/^https?:/.test(url)) img.crossOrigin = "anonymous";
      img.onload = function(){
        try {
          REFIMG[name] = img;
          REF[name] = refSig(img);
          REF[name].views = refViews(img);
          REF[name].tpl = refTemplates(img);
          REF[name].w = img.naturalWidth;
          REF[name].h = img.naturalHeight;
        }
        catch(err){ refState.failed++; refState.why = refState.why || ("read: "+err.message); tick(); return; }   /* tainted canvas */
        tick();
      };
      img.onerror = function(){ i++; attempt(); };
      img.src = url;
    }
    attempt();
  });

  function tick(){
    refState.done++;
    if (refState.done >= refState.total){
      refState.running = false;
      try { localStorage.setItem(REF_KEY, JSON.stringify(REF)); } catch(e){}
      finishRefs(cb);
    }
  }
}

/* Render a crop to a data URL so it can be eyeballed. */
function cropURL(img, x, y, w, h, outW, outH){

  var g=c.getContext("2d");
  g.fillStyle="#000"; g.fillRect(0,0,outW,outH);
  g.drawImage(img, x, y, w, h, 0, 0, outW, outH);
  try { return c.toDataURL(); } catch(e){ return ""; }
}

/* Slot crop exactly as the matcher sees it. */
function slotCropURL(t){

/* Reference crop exactly as the matcher sees it, loaded fresh so we

/* ── window sweep ───────────────────────────────────────────────
   Everything else is switched off here: no edges, no profile, no
   cost, no weighting. Just raw masked colour distance between the
   screenshot crop and a reference, over many candidate windows.

   The aim is to find the window where the correct card separates
   from unrelated ones. If no window does that, the screenshot crop
   does not contain what we think it does. */
var EXPECT = ["Rocket","Golem","Heal Spirit"];
var FOILS  = ["Tombstone","Graveyard","Ice Wizard"];

function rawDist(shot, ref){
  if(!ref || !ref.m) return 1e9;
  return colourDist(shot, ref);
}

/* Fit into the grid without stretching: letterbox instead. */
function fitSig(img, x, y, w, h){
  var c=document.createElement("canvas"); c.width=GW; c.height=GH;
  var g=c.getContext("2d",{willReadFrequently:true});
  g.fillStyle="#000"; g.fillRect(0,0,GW,GH);
  var s=Math.min(GW/w, GH/h);
  var dw=w*s, dh=h*s;
  g.drawImage(img, x, y, w, h, (GW-dw)/2, (GH-dh)/2, dw, dh);
  return describe(g.getImageData(0,0,GW,GH).data, false);
}



/* ── keypoint feature matching ──────────────────────────────────
   Instead of comparing pixel (x,y) to pixel (x,y), find distinctive
   corners in each image, describe the pattern of brightness around
   them, and count how many descriptions match. Tolerant of scale,
   shift and framing, which is what defeated the grid comparisons.

   A compact FAST-style corner detector with BRIEF descriptors. No
   library, no training, no labelling. */
var FMW = 128, FMH = 160, NPAIRS = 128, PATCH = 13;

var BRIEF_PAIRS = (function(){
  /* deterministic pseudo-random offsets so both sides use the same */
  var s = 12345, out = [];
  function rnd(){ s = (s*1103515245 + 12345) & 0x7fffffff; return s / 0x7fffffff; }
  for(var i=0;i<NPAIRS;i++){
    out.push([
      Math.round((rnd()-0.5)*PATCH), Math.round((rnd()-0.5)*PATCH),
      Math.round((rnd()-0.5)*PATCH), Math.round((rnd()-0.5)*PATCH)
    ]);
  }
  return out;
})();

function grayOf(img, x, y, w, h){
  var c=document.createElement("canvas"); c.width=FMW; c.height=FMH;
  var g=c.getContext("2d",{willReadFrequently:true});
  g.fillStyle="#000"; g.fillRect(0,0,FMW,FMH);
  var s=Math.min(FMW/w, FMH/h), dw=w*s, dh=h*s;
  g.drawImage(img, x, y, w, h, (FMW-dw)/2, (FMH-dh)/2, dw, dh);
  var d=g.getImageData(0,0,FMW,FMH).data, out=new Float32Array(FMW*FMH);
  for(var i=0;i<FMW*FMH;i++) out[i]=0.299*d[i*4]+0.587*d[i*4+1]+0.114*d[i*4+2];
  return out;
}

function corners(gr, max){
  var R=3, pts=[], i, x, y;
  var offs=[[R,0],[-R,0],[0,R],[0,-R],[2,2],[-2,2],[2,-2],[-2,-2]];
  var score=new Float32Array(FMW*FMH);
  for(y=R+2;y<FMH-R-2;y++){
    for(x=R+2;x<FMW-R-2;x++){
      var c0=gr[y*FMW+x], s=0;
      for(i=0;i<offs.length;i++) s += Math.abs(gr[(y+offs[i][1])*FMW+(x+offs[i][0])] - c0);
      score[y*FMW+x]=s;
    }
  }
  var cand=[];
  for(y=R+3;y<FMH-R-3;y++){
    for(x=R+3;x<FMW-R-3;x++){
      var v=score[y*FMW+x];
      if(v < 200) continue;
      if(v>=score[y*FMW+x-1] && v>=score[y*FMW+x+1] &&
         v>=score[(y-1)*FMW+x] && v>=score[(y+1)*FMW+x]) cand.push([x,y,v]);
    }
  }
  cand.sort(function(a,b){ return b[2]-a[2]; });
  /* spread them out, so one busy area cannot supply every point */
  var taken=[];
  for(i=0;i<cand.length && taken.length<(max||110);i++){
    var ok=true;
    for(var j=0;j<taken.length;j++){
      var dx=cand[i][0]-taken[j][0], dy=cand[i][1]-taken[j][1];
      if(dx*dx+dy*dy < 36){ ok=false; break; }
    }
    if(ok) taken.push(cand[i]);
  }
  return taken;
}

function brief(gr, pts){
  /* 128 bits packed into four 32-bit words, so comparing two points
     is four XORs and four popcounts instead of 128 comparisons. */
  var out=[];
  for(var k=0;k<pts.length;k++){
    var px=pts[k][0], py=pts[k][1], w=new Uint32Array(4);
    for(var i=0;i<NPAIRS;i++){
      var p=BRIEF_PAIRS[i];
      var a=gr[(py+p[1])*FMW + (px+p[0])];
      var b=gr[(py+p[3])*FMW + (px+p[2])];
      if(a<b) w[i>>5] |= (1 << (i & 31));
    }
    out.push(w);
  }
  return out;
}

function popcnt(v){
  v = v - ((v >> 1) & 0x55555555);
  v = (v & 0x33333333) + ((v >> 2) & 0x33333333);
  return (((v + (v >> 4)) & 0x0F0F0F0F) * 0x01010101) >> 24;
}
function hamm(a,b){
  return popcnt(a[0]^b[0]) + popcnt(a[1]^b[1]) + popcnt(a[2]^b[2]) + popcnt(a[3]^b[3]);
}

function featureSet(img, x, y, w, h){
  var gr=grayOf(img, x, y, w, h);
  var pts=corners(gr);
  return { pts:pts, desc:brief(gr, pts) };
}

/* Lowe ratio test: a match counts only if it is clearly better than
   the next best, which throws out repetitive texture. */
function matchDetail(A, B){
  var pairs=[], cands=0;
  for(var i=0;i<A.desc.length;i++){
    var b1=999, b2=999, bj=-1;
    for(var j=0;j<B.desc.length;j++){
      var d=hamm(A.desc[i], B.desc[j]);
      if(d<b1){ b2=b1; b1=d; bj=j; } else if(d<b2) b2=d;
    }
    if(b1 < 46) cands++;
    if(b1 < 34 && b1 < b2*0.8) pairs.push([A.pts[i], B.pts[bj]]);
  }

  /* Geometric check. Both images are letterboxed into the same box,
     so matching points on the same object should share a similar
     offset. Random matches scatter; real ones cluster. */
  var bins={}, bestBin=0;
  pairs.forEach(function(p){
    var dx=Math.round((p[0][0]-p[1][0])/14), dy=Math.round((p[0][1]-p[1][1])/14);
    var k=dx+","+dy;
    bins[k]=(bins[k]||0)+1;
    if(bins[k]>bestBin) bestBin=bins[k];
  });

  return { good:pairs.length, geo:bestBin,
           cands:cands, quality: cands ? pairs.length/cands : 0 };
}

function matchCount(A,B){ return matchDetail(A,B).geo; }

var FEAT = {};
function refFeat(name){
  if(FEAT[name]) return FEAT[name];
  var im=REFIMG[name];
  if(!im) return null;
  FEAT[name]=featureSet(im, 0, 0, im.naturalWidth, im.naturalHeight);
  return FEAT[name];
}

function cropScaleTest(){

function resTest(){
  if(!S.img || !S.taps.length) return "";
  var t = S.taps[0];
  var top = t.cands && t.cands[0];
  if(!top || !refFeat(top)) return "";

  var big = featureSet(S.img, t.x-t.w/2, t.y-t.h/2, t.w, t.h);
  var mBig = matchDetail(big, refFeat(top));

  /* shrink the identical crop to 39x50, then match it the same way */
  var c=document.createElement("canvas"); c.width=39; c.height=50;
  var g=c.getContext("2d");
  g.drawImage(S.img, t.x-t.w/2, t.y-t.h/2, t.w, t.h, 0, 0, 39, 50);
  var small = featureSet(c, 0, 0, 39, 50);
  var mSmall = matchDetail(small, refFeat(top));

  return '<div class="diagCol"><div class="diagH">resolution test &middot; slot 1 vs '
    + esc(top) + ' &middot; same crop at two sizes</div>'
    + '<div><span>original '+Math.round(t.w)+'x'+Math.round(t.h)+'</span>'
    + '<b>kp '+big.pts.length+' &middot; geo '+mBig.geo+' &middot; good '+mBig.good+'</b></div>'
    + '<div><span>shrunk 39x50</span>'
    + '<b>kp '+small.pts.length+' &middot; geo '+mSmall.geo+' &middot; good '+mSmall.good+'</b></div>'
    + '</div>';
}

function featureBlock(){
  if(!S.img || !S.taps.length || !Object.keys(REFIMG).length) return "";
  var tests = ["Rocket","Golem","Heal Spirit"];
  var foils = ["Tombstone","Graveyard","Ice Wizard","Prince","Lava Hound","Dart Goblin"];
  var rows="";

  tests.forEach(function(want,i){
    var t=S.taps[i];
    if(!t || !REFIMG[want] || S.taps.length > 6) return;
    var A=featureSet(S.img, t.x-t.w/2, t.y-t.h/2, t.w, t.h);
    var list=[want].concat(foils.filter(function(f){ return f!==want; })).slice(0,5);
    rows += '<div class="diagH" style="margin-top:8px">'+esc(want)
      + ' &middot; kp '+A.pts.length+'</div>'
      + '<div><span style="color:var(--low)">card</span>'
      + '<b style="color:var(--low)">good / geo / quality</b></div>';
    list.forEach(function(nm){
      var rf=refFeat(nm);
      if(!rf) return;
      var m=matchDetail(A, rf);
      var hit = (nm===want);
      rows += '<div><span'+(hit?' style="color:#7CE38B"':'')+'>'+esc(nm)+'</span>'
        + '<b>'+m.good+' / '+m.geo+' / '+(m.quality*100).toFixed(0)+'%</b></div>';
    });
  });

  return '<div class="diagCol"><div class="diagH">feature matching &middot; '
    + 'good matches, geometrically consistent, match quality</div>'+rows+'</div>';
}

/* ── view experiment ────────────────────────────────────────────
   Cards do not fill their frame the same way, so one fixed window
   cannot suit all of them. These are a handful of standard views,
   applied identically to the screenshot and the reference, with no
   per-card configuration. */
var VIEWS = [
  ["full",    0.00, 1.00, 0.04],
  ["top",     0.00, 0.55, 0.06],
  ["middle",  0.15, 0.55, 0.06],
  ["centre",  0.10, 0.70, 0.12],
  ["lower",   0.35, 0.55, 0.06],
  ["artwork", ART_Y0, ART_Y1-ART_Y0, ART_X0]
];

function viewOf(img, X, Y, W, H, v){
  return fitSig(img, X + W*v[3], Y + H*v[1], W*(1-v[3]*2), H*v[2]);
}
function refView(name, v){
  var im = REFIMG[name];
  if(!im) return null;
  var s = viewOf(im, 0, 0, im.naturalWidth, im.naturalHeight, v);
  s.m = []; for(var i=0;i<GW*GH;i++) s.m.push(1);
  return s;
}

function expBlock(){
  if(!S.img || !S.taps.length || !Object.keys(REFIMG).length) return "";
  var rows = "";
  EXPECT.forEach(function(want, i){
    var t = S.taps[i];
    if(!t || !REFIMG[want] || S.taps.length > 6) return;
    rows += '<div class="diagH" style="margin-top:8px">'+esc(want)+'</div>';
    VIEWS.forEach(function(v){
      var sg = viewOf(S.img, t.x-t.w/2, t.y-t.h/2, t.w, t.h, v);
      var rc = refView(want, v);
      if(!rc) return;
      function metric(fn){
        var good = fn(sg, rc);
        var bad = 1e9;
        FOILS.concat(["Prince","Lava Hound","Furnace","Vines"]).forEach(function(f){
          if(f===want) return;
          var rf = refView(f, v);
          if(rf) bad = Math.min(bad, fn(sg, rf));
        });
        return [good, bad];
      }
      var c = metric(colourDist);
      var e = metric(edgeDist);
      var b = metric(function(a,z){ return colourDist(a,z) + edgeDist(a,z)*0.8; });
      function fmt(p){
        var win = p[0] < p[1];
        return '<b style="color:'+(win?"#7CE38B":"var(--mid)")+'">'
          + p[0].toFixed(0)+'/'+p[1].toFixed(0)+'</b>';
      }
      rows += '<div><span>'+v[0]+'</span>'
        + '<b style="min-width:150px;display:flex;gap:10px;justify-content:flex-end">'
        + fmt(c) + fmt(e) + fmt(b) + '</b></div>';
    });
  });
  return '<div class="diagCol"><div class="diagH">view experiment &middot; '
    + 'correct/best-foil &middot; colour, edges, combined &middot; green means correct wins</div>'
    + rows + '</div>';
}

function sweepBlock(){
  if(!S.img || !S.taps.length || !Object.keys(REF).length) return "";
  var ys = [0.00,0.05,0.10,0.15,0.20];
  var hs = [0.55,0.65,0.75,0.85];
  var xs = [0.03,0.08,0.14];

  var out = S.taps.map(function(t,i){
    var want = EXPECT[i];
    if(!REF[want]) return '<div><span>slot '+(i+1)+'</span><b>no ref</b></div>';
    var best=null;
    ys.forEach(function(y0){ hs.forEach(function(hf){ xs.forEach(function(xi){
      var x = t.x - t.w/2 + t.w*xi;
      var y = t.y - t.h/2 + t.h*y0;
      var w = t.w*(1-xi*2), h = t.h*hf;
      var sg = fitSig(S.img, x, y, w, h);
      var d = rawDist(sg, REF[want]);
      var foil = 1e9;
      FOILS.forEach(function(f){ if(REF[f]) foil = Math.min(foil, rawDist(sg, REF[f])); });
      if(!best || (d - foil) < best.gap) best = { y0:y0, hf:hf, xi:xi, d:d, foil:foil, gap:d-foil };
    });});});
    return '<div><span>slot '+(i+1)+' '+esc(want)
      + ' &middot; y'+best.y0+' h'+best.hf+' x'+best.xi+'</span>'
      + '<b>'+best.d.toFixed(0)+' vs foil '+best.foil.toFixed(0)+'</b></div>';
  }).join("");

  var t0=S.taps[0];
  var cur = "";
  if(t0){
    var sg = fitSig(S.img, t0.x-t0.w/2+t0.w*ART_X0, t0.y-t0.h/2+t0.h*ART_Y0,
                           t0.w*(ART_X1-ART_X0), t0.h*(ART_Y1-ART_Y0));
    var lit=0; for(var i2=0;i2<sg.p.length;i2+=3) if(sg.p[i2]+sg.p[i2+1]+sg.p[i2+2] > 30) lit++;
    cur = '<div><span>screenshot cells lit</span><b>'+lit+'/'+(GW*GH)+'</b></div>';
  }

  return '<div class="diagCol"><div class="diagH">window sweep &middot; raw colour only &middot; '
    + 'lower is better, want a big gap to foil</div>'+out+cur+'</div>';
}

function baselineBlock(){
  var pairs = [
    ["Rocket","Rocket"], ["Rocket","Tombstone"], ["Rocket","Graveyard"],
    ["Golem","Golem"],   ["Golem","Prince"],     ["Golem","Lava Hound"],
    ["Ice Spirit","Ice Spirit"], ["Ice Spirit","Ice Wizard"], ["Ice Spirit","Dart Goblin"]
  ];
  var rows = pairs.map(function(p){
    var a=REF[p[0]], b=REF[p[1]];
    var v = (a&&b) ? artScore(a,b).toFixed(1) : "-";
    return '<div><span>'+esc(p[0])+' vs '+esc(p[1])+'</span><b>'+v+'</b></div>';
  }).join("");

  var t = S.taps[0];
  var dims = "";
  if(t){
    var r = REF["Rocket"];
    dims = '<div><span>screenshot crop px</span><b>'
      + Math.round(t.w*(ART_X1-ART_X0))+' x '+Math.round(t.h*(ART_Y1-ART_Y0))+'</b></div>'
      + '<div><span>reference source px</span><b>'
      + (r&&r.w ? r.w+' x '+r.h : "?")+'</b></div>'
      + '<div><span>both sampled to</span><b>'+GW+' x '+GH+'</b></div>';
  }

  return '<div class="diagCol"><div class="diagH">descriptor baseline &middot; '
    + 'same image against itself should be 0</div>'+rows+dims+'</div>';
}

function refCells(){
  var k=Object.keys(REF)[0];
  if(!k||!REF[k]||!REF[k].m) return "?";
  var n=0; for(var i=0;i<REF[k].m.length;i++) n+=REF[k].m[i];
  return n+"/"+REF[k].m.length;
}

function pairBlock(){
  var check = ["Rocket","Golem","Heal Spirit","Ice Spirit"];
  check.forEach(function(n){ refCropURL(n, function(){ if(S.tab==="scan") render(); }); });

  var slots = S.taps.map(function(t,i){
    var top = t.cands && t.cands[0];
    if(top) refCropURL(top, function(){ if(S.tab==="scan") render(); });
    return '<div class="pair">'
      + '<div><img src="'+slotCropURL(t)+'"><span>slot '+(i+1)+'</span></div>'
      + '<div><img src="'+(top?(REFPIC[top]||""):"")+'"><span>'+esc(top||"-")+'</span></div>'
      + '</div>';
  }).join("");

  var ids = check.map(function(n){
    return '<div><img src="'+(REFPIC[n]||"")+'"><span>'+esc(SLUG[n]||"?")+'.png</span></div>';
  }).join("");

  return '<div class="diagCol"><div class="diagH">crop vs top match</div>'
    + '<div class="pairs">'+slots+'</div></div>'
    + '<div class="diagCol"><div class="diagH">reference identity check</div>'
    + '<div class="ids">'+ids+'</div></div>';
}

function diagBlock(){
  return '<div class="diag">' + boxOverlay() + rawCrops() + cropScaleTest() + baselineBlock() + resTest() + featureBlock() + expBlock() + sweepBlock() + pairBlock() + S.taps.map(function(t,i){
    var rows = (t.cands||[]).map(function(nm,j){
      var d = t.detail && t.detail[nm];
      var v = d ? ('geo '+d.geo+' &middot; good '+d.good
                   +' &middot; '+(d.quality*100).toFixed(0)+'%'
                   +' &middot; s'+((d.combined||0)*100).toFixed(0))
                : "-";
      return '<div><span>'+(j+1)+'. '+esc(nm)+'</span><b>'+v+'</b></div>';
    }).join("") || '<div><span>no candidates</span><b>-</b></div>';
    return '<div class="diagCol"><div class="diagH">slot '+(i+1)
      + ' &middot; cost '+(t.cost===null||t.cost===undefined?"?":t.cost)
      + ' &middot; via '+(t.why||"-")+' &middot; mode '+S.mode
      + ' &middot; library '+(t.pool===undefined?"?":t.pool)
      + ' &middot; crop '+Math.round(t.w)+'x'+Math.round(t.h)
      + ' &middot; kp '+(t.kp===undefined?"?":t.kp)
      + ' &middot; gap '+((t.conf||0)*100).toFixed(0)
      + (t.cands && t.cands[1] && t.detail
          ? ' &middot; 2nd '+esc(t.cands[1])
            +' geo '+t.detail[t.cands[1]].geo
            +' good '+t.detail[t.cands[1]].good
          : "")
      + ' &middot; ref cells '+refCells()
      + '</div>'+rows+'</div>';
  }).join("") + '</div>';
}

function vScan(){
  var h = '<div class="seg">'
    + Object.keys(LAYOUTS).map(function(k){
        return '<button data-mode="'+k+'" aria-pressed="'+(S.mode===k)+'">'
          + esc(LAYOUTS[k].label)+'</button>';
      }).join("")
    + '</div>'
    + '<label class="cta">Load screenshot'
    + '<input type="file" accept="image/*" id="file" style="display:none"></label>';
  if(!S.img) return h + '<div class="meta">Screenshot the card pick screen. '
    + 'It reads the three cards and ranks them.</div>';

  var known = S.taps.filter(function(t){ return t.name; });
  if(known.length){
    var rk = known.map(function(t){ return byName(t.name); })
                  .sort(function(a,b){ return b.avg-a.avg; });
    var lowest = S.taps.filter(function(t){return t.name;})
                       .reduce(function(a,t){ return Math.min(a, t.conf===undefined?1:t.conf); }, 1);
    var costs = S.taps.map(function(t){ return t.cost || "?"; }).join("  ");
    var shotEl = document.getElementById("shot");
    var dispW = shotEl ? shotEl.clientWidth : 0;
    var dispH = shotEl ? shotEl.clientHeight : 0;
    var t0 = S.taps[0];
    var thin = '<div class="meta" style="padding:0 16px 6px">'
      + 'screenshot natural ' + S.img.naturalWidth + ' x ' + S.img.naturalHeight
      + ' &middot; displayed ' + dispW + ' x ' + dispH
      + ' &middot; scale ' + (dispW ? (S.img.naturalWidth/dispW).toFixed(2) : "?")
      + (t0 ? ' &middot; slot crop original ' + Math.round(t0.w) + ' x ' + Math.round(t0.h) : "")
      + '</div>';
    var regionLine = '<div class="meta" style="padding:0 16px 6px">mode '+esc(S.mode)
      + ' &middot; screen cards ' + S.taps.length + ' &middot; library '
      + Object.keys(REF).length + '</div>';
    h += '<div class="eyebrow">Best to worst &middot; tap a name to correct'
      + (lowest < 0.25 ? ' &middot; low confidence' : '') + '</div>'
      + thin + regionLine
      + '<div class="meta" style="padding:0 16px 8px">elixir read: '+esc(costs)+'</div>'
      + diagBlock()
      + '<div class="list">'
      + rk.map(function(c,i){ return verdict(c, i===0 && rk.length>1); }).join("") + '</div>';
  }

  if(S.pending !== null && !S.taps[S.pending]) S.pending = null;
  if(S.pending !== null){
    var t = S.taps[S.pending];
    var shortlist = (t.cands && t.cands.length) ? t.cands : [];
    var q = S.lq.toLowerCase();
    var listed = q
      ? CARDS.filter(function(c){ return c.card.toLowerCase().indexOf(q)!==-1; })
             .map(function(c){ return c.card; }).slice(0,20)
      : shortlist;
    h += '<div class="ask">'
      + '<div class="askH">Closest matches</div>'
      + '<div class="grid">'
      + listed.map(function(nm){
          return '<button data-learn="'+esc(nm)+'">'
            + (SLUG[nm] ? '<img src="cards/'+SLUG[nm]+'.png" alt="">' : "")
            + '<span>'+esc(nm)+'</span></button>';
        }).join("")
      + '</div>'
      + '<input class="srch" id="lq" placeholder="Or search all cards" value="'+esc(S.lq)+'">'
      + '<button class="ghost" data-skip="1">Cancel</button></div>';
  }

  h += '<div class="wrapOuter"><div id="wrap"><img id="shot" src="'+S.img.src+'" alt="">'
    + '<div class="mk" id="mk"></div></div></div>'
    + '<button class="ghost" data-reset="1">New screenshot</button>';
  var r=Object.keys(REF).length;
  if (r < refState.total){
    h += '<div class="meta">card art '+r+'/'+refState.total
      + (refState.failed?' &middot; '+refState.failed+' failed':'')
      + (refState.why?' &middot; '+esc(refState.why):'') + '</div>';
  }
  return h;
}

function readSlots(){
  SLOTS = LAYOUTS[S.mode].slots;
  S.taps = SLOTS.map(function(s){
    var w  = S.img.naturalWidth * s.w;
    var hh = w / (LAYOUTS[S.mode].aspect || CARD_ASPECT);
    var cx = S.img.naturalWidth * s.x;
    var cy = S.img.naturalHeight * s.y;
    var r = recognise(cx, cy, w, hh);
    /* a confident read teaches the digit library its own cost */
    /* no self-teaching: a wrong recognition would file a wrong digit
       and make the next scan worse */
    return { x:cx, y:cy, w:w, h:hh, size:w, sig:r.sig, dmask:r.dmask,
             name:r.name, cands:r.ranked, conf:r.conf, cost:r.cost,
             scores:r.scores, detail:r.detail, why:r.why, pool:r.pool, kp:r.kp };
  });
  nextUnknown();
}
/* Only set by tapping a result to correct it. */
function nextUnknown(){
  if(S.pending !== null && !S.taps[S.pending]) S.pending = null;
  S.pending=null;
  for(var i=0;i<S.taps.length;i++)
    if(!S.taps[i].name && S.taps[i].asked){ S.pending=i; S.lq=""; return; }
}

function vCards(){
  return '<input class="srch" id="q" placeholder="Search cards" value="'+esc(S.q)+'">'
    + '<div class="list">'+filtered().map(function(c){
        return item(c, S.deck.indexOf(c.card)!==-1); }).join("")+'</div>'
    + '<div class="key">'+BANDS.map(function(b){
        return '<span><i style="background:'+b.c+'"></i>'+b.t+' '+b.n+'</span>';
      }).join("")+'</div>'
    + '<div class="meta">Ratings from RoyaleAPI, based on real win rates.</div>';
}

function vDeck(){
  if(!S.deck.length) return '<div class="meta" style="padding-top:30px">Add cards from the Cards tab.</div>';
  var cs=S.deck.map(byName).filter(function(c){ return c.common; });
  if(!cs.length) return '<div class="meta" style="padding-top:30px">No modifier data for those cards.</div>';
  var avg=cs.reduce(function(a,c){ return a+c.avg; },0)/cs.length;
  var odds=WAVES.map(function(w){
    var pw=0;
    R.forEach(function(r){
      if(!w[r]) return;
      pw += w[r] * (cs.filter(function(c){ return !isGood(c[r].v); }).length/cs.length);
    });
    return {n:w.n, p:1-pw*pw};
  });
  return '<div class="stat"><div><div class="big">'+Math.round(avg)+'</div>'
    + '<div class="statLbl">deck rating</div></div>'
    + '<div style="text-align:right"><div class="big">'+S.deck.length+'</div>'
    + '<div class="statLbl">of 8</div></div></div>'
    + '<div class="eyebrow">Odds of a strong offer</div>'
    + '<div style="border-top:1px solid var(--line)">'
    + odds.map(function(w){
        return '<div class="wave"><span class="wn">'+w.n+'</span>'
          + '<div class="trk"><div class="fil" style="width:'+(w.p*100)+'%"></div></div>'
          + '<span class="wp">'+Math.round(w.p*100)+'</span></div>';
      }).join("")+'</div>'
    + '<div class="chips">'+S.deck.map(function(n){
        return '<button data-toggle="'+esc(n)+'">'+esc(n)+' \u00d7</button>';
      }).join("")+'</div>';
}

function render(){
  var el=document.getElementById("view"), af=document.activeElement;
  var fid=(af&&(af.id==="q"||af.id==="lq"))?af.id:null;
  var car=fid?af.selectionStart:null;
  el.innerHTML = S.tab==="scan" ? vScan() : S.tab==="cards" ? vCards() : vDeck();
  document.querySelectorAll(".tabs button").forEach(function(b){
    b.setAttribute("aria-selected", b.dataset.tab===S.tab ? "true":"false"); });
  if(fid){ var f=document.getElementById(fid); if(f){ f.focus(); f.setSelectionRange(car,car); } }
  marks();
}

function marks(){
  var box=document.getElementById("mk"), shot=document.getElementById("shot");
  if(!box||!shot||!S.img) return;
  if(!shot.clientWidth){ shot.onload=marks; return; }
  var sc=shot.clientWidth/S.img.naturalWidth;
  box.innerHTML = S.taps.map(function(t,i){
    var s=t.size*sc;
    return '<div style="left:'+(t.x*sc)+'px;top:'+(t.y*sc)+'px;width:'+s+'px;height:'+s+'px">'
      + '<b>'+(t.name?esc(t.name):(i+1))+'</b></div>';
  }).join("");
}

document.querySelector(".tabs").addEventListener("click",function(e){
  var b=e.target.closest("button[data-tab]"); if(!b) return;
  S.tab=b.dataset.tab; S.open=null; render();
});
document.getElementById("view").addEventListener("change",function(e){
  if(e.target.id!=="file") return;
  var f=e.target.files&&e.target.files[0]; if(!f) return;
  var i=new Image();
  i.onload=function(){
    S.img=i; S.taps=[]; S.pending=null;
    render();
    loadRefs(function(){ if(S.img){ readSlots(); render(); } });
  };
  i.src=URL.createObjectURL(f);
});
document.getElementById("view").addEventListener("click",function(e){
  var fx=e.target.closest("[data-fix]");
  if(fx && S.tab==="scan"){
    var want=fx.dataset.fix;
    for(var k=0;k<S.taps.length;k++){
      if(S.taps[k].name===want){ S.taps[k].name=null; S.taps[k].asked=true; break; }
    }
    nextUnknown(); render(); return;
  }
  var l=e.target.closest("[data-learn]");
  if(l){
    var n=l.dataset.learn, t=S.taps[S.pending];
    if(!t){ S.pending=null; render(); return; }
    if(!S.lib[n]) S.lib[n]=[];
    S.lib[n].push(t.sig);
    if(COST[n]) learnDigit(COST[n], t.dmask);
    if(S.lib[n].length>6) S.lib[n].shift();
    saveLib(S.lib);
    t.name=n; nextUnknown(); render(); return; }
  var md=e.target.closest("[data-mode]");
  if(md){
    if(S.mode !== md.dataset.mode){
      S.mode = md.dataset.mode;
      /* slot count changes with the layout, so anything pointing at a
         slot index from the previous mode is no longer valid */
      S.pending = null; S.lq = ""; S.open = null; S.taps = [];
      if(S.img) readSlots();
    }
    render(); return;
  }
  if(e.target.closest("[data-diag]")){ S.diag=!S.diag; render(); return; }
  if(e.target.closest("[data-skip]")){
    if(S.taps[S.pending]) S.taps[S.pending].asked=false;
    S.pending=null; render(); return; }
  if(e.target.closest("[data-reset]")){ S.img=null; S.taps=[]; S.pending=null; render(); return; }
  if(e.target.closest("[data-wipe]")){ S.lib={}; saveLib(S.lib); render(); return; }
  var o=e.target.closest("[data-open]");
  if(o){ S.open = S.open===o.dataset.open ? null : o.dataset.open; render(); return; }
  var g=e.target.closest("[data-toggle]");
  if(g){ toggle(S.deck,g.dataset.toggle,8); render(); return; }
});
document.getElementById("view").addEventListener("input",function(e){
  if(e.target.id==="q"){ S.q=e.target.value; render(); }
  if(e.target.id==="lq"){ S.lq=e.target.value; render(); }
});
window.addEventListener("resize",marks);
render();
loadRefs(function(){ if(S.img){ readSlots(); } render(); });
</script>
</body>
</html>
