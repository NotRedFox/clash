<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#101014">
<title>Chaos Draft</title>
<style>
:root{
  --bg:#101014; --surface:#18181E; --line:#26262F; --line2:#33333F;
  --ink:#F0F0F2; --mid:#9A9AA6; --low:#61616E; --acc:#FFD400;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg)}
body{color:var(--ink);
  font:400 15px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  padding:calc(12px + env(safe-area-inset-top)) 0 calc(24px + env(safe-area-inset-bottom));
  max-width:460px;margin:0 auto;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--acc);outline-offset:-2px}

.tabs{display:flex;border-bottom:1px solid var(--line);margin-bottom:2px}
.tabs button{flex:1;min-height:46px;font-size:.72rem;font-weight:700;letter-spacing:.08em;
  text-transform:uppercase;color:var(--low);border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--acc)}

.eyebrow{font-size:.66rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;
  color:var(--low);padding:18px 16px 8px}

.list{border-top:1px solid var(--line)}
.item{border-bottom:1px solid var(--line)}
.item.on{background:var(--surface);box-shadow:inset 3px 0 0 var(--acc)}
.head{display:flex;align-items:center;gap:12px;padding:0 16px;min-height:50px}
.nm{flex:1;min-width:0;text-align:left;font-size:.9rem;font-weight:600;padding:14px 0;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sc{font-size:.9rem;font-weight:800;font-variant-numeric:tabular-nums;min-width:26px;text-align:right}
.add{width:30px;height:30px;flex:none;border:1px solid var(--line2);color:var(--mid);
  font-size:1rem;line-height:1;display:grid;place-items:center}
.add.on{background:var(--acc);border-color:var(--acc);color:#101014;font-weight:800}

.tbar{display:flex;height:5px;margin:0 16px 10px}
.tbar div{height:100%}
.tlab{display:flex;gap:12px;padding:0 16px 12px;font-size:.64rem;color:var(--mid);
  font-variant-numeric:tabular-nums}
.tlab span{display:flex;align-items:center;gap:4px}
.tlab i{width:7px;height:7px;display:block}

.exp{padding:2px 16px 14px;display:flex;flex-direction:column;gap:11px}
.mod{display:grid;grid-template-columns:3px 1fr auto;gap:11px;align-items:start}
.bar{align-self:stretch}
.mr{font-size:.62rem;font-weight:700;letter-spacing:.1em;color:var(--low);text-transform:uppercase}
.me{font-size:.84rem;color:#C9C9D2;margin-top:2px}
.mv{font-size:.78rem;font-weight:700;font-variant-numeric:tabular-nums;color:var(--mid)}

.srch{width:100%;min-height:44px;padding:0 16px;background:var(--surface);border:0;
  border-top:1px solid var(--line);border-bottom:1px solid var(--line);
  color:var(--ink);font:inherit;font-size:.9rem}
.srch:focus{outline:none}
.srch::placeholder{color:var(--low)}

.stat{display:flex;align-items:flex-end;justify-content:space-between;padding:6px 16px 18px}
.big{font-size:2.6rem;font-weight:800;line-height:.9;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.statLbl{font-size:.66rem;letter-spacing:.1em;text-transform:uppercase;color:var(--low)}
.wave{display:grid;grid-template-columns:14px 1fr 34px;gap:11px;align-items:center;
  padding:9px 16px;border-bottom:1px solid var(--line)}
.wn{font-size:.72rem;font-weight:700;color:var(--mid);font-variant-numeric:tabular-nums}
.trk{height:6px;background:var(--surface)}
.fil{height:100%;background:var(--acc);transition:width .25s}
.wp{font-size:.78rem;font-weight:700;text-align:right;font-variant-numeric:tabular-nums}
.chips{display:flex;flex-wrap:wrap;gap:4px;padding:14px 16px}
.chips button{background:var(--surface);border:1px solid var(--line);padding:7px 10px;
  font-size:.75rem;color:var(--mid)}

.pk{border-bottom:1px solid var(--line);padding:14px 16px}
.pk.win{background:var(--surface);box-shadow:inset 3px 0 0 var(--acc)}
.pkTop{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.refimg{width:38px;height:46px;object-fit:contain;background:#000;flex:none;margin-right:9px;
  vertical-align:middle;border:1px solid var(--line2)}
.pkNm{font-size:1.05rem;font-weight:700;letter-spacing:-.01em}
.rk{display:inline-block;min-width:20px;margin-right:8px;color:var(--low);
  font-size:.8rem;font-weight:700;font-variant-numeric:tabular-nums}
.pkSc{font-size:1.05rem;font-weight:800;font-variant-numeric:tabular-nums;color:var(--acc)}
.tag{font-size:.6rem;font-weight:800;letter-spacing:.1em;color:var(--acc);display:block;margin-bottom:4px}
.pkMods{display:flex;flex-direction:column;gap:7px}
.pkMod{display:grid;grid-template-columns:3px 1fr auto;gap:10px;align-items:center}

.cta{display:grid;place-items:center;width:100%;min-height:50px;background:var(--acc);
  color:#101014;font-weight:800;font-size:.85rem;letter-spacing:.04em;text-transform:uppercase}
.ghost{display:block;width:100%;min-height:44px;border-top:1px solid var(--line);
  color:var(--mid);font-size:.8rem}
.wrapOuter{text-align:center;padding:8px 0}
#wrap{position:relative;display:inline-block;line-height:0}
#shot{max-height:30vh;max-width:100%;width:auto;display:block}
.mk{position:absolute;inset:0;pointer-events:none}
.mk div{position:absolute;border:2px solid var(--acc);transform:translate(-50%,-50%)}
.mk b{position:absolute;top:-8px;left:-2px;background:var(--acc);color:#101014;
  font-size:.58rem;padding:0 4px;white-space:nowrap}
.ask{border-top:2px solid var(--acc);background:var(--surface)}
.askH{font-size:.8rem;font-weight:700;padding:14px 16px 0}
.opts{max-height:210px;overflow-y:auto}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:10px 12px}
.grid button{display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 2px;
  background:var(--bg);border-radius:4px}
.grid img{width:100%;max-width:56px;aspect-ratio:3/4;object-fit:contain}
.diag{padding:0 16px 12px;display:flex;flex-direction:column;gap:10px}
.diagCol{border-top:1px solid var(--line);padding-top:8px}
.diagH{font-size:.62rem;letter-spacing:.08em;text-transform:uppercase;color:var(--low);margin-bottom:5px}
.diagCol div{display:flex;justify-content:space-between;font-size:.7rem;color:var(--mid);padding:1px 0}
.diagCol b{color:var(--ink);font-variant-numeric:tabular-nums}
.grid span{font-size:.6rem;color:var(--mid);text-align:center;line-height:1.15}
.opts button{display:block;width:100%;text-align:left;padding:11px 16px;font-size:.85rem;
  border-bottom:1px solid var(--line)}

.meta{font-size:.7rem;color:var(--low);padding:16px}
.key{display:flex;flex-wrap:wrap;gap:10px;padding:16px;font-size:.68rem;color:var(--mid)}
.key span{display:flex;align-items:center;gap:5px}
.key i{width:9px;height:9px;display:block}

@media (max-width:350px){ body{font-size:14px} }
@media (prefers-reduced-motion:reduce){ .fil{transition:none} }
</style>
</head>

/* Card art, tried in order until one loads. */
var ART = [
  "cards/{s}.png",                                             /* same origin, always readable */
  "https://cdn.royaleapi.com/static/img/cards-150/{s}.png",    /* fallback, often blocked by CORS */
  "https://royaleapi.github.io/cr-api-assets/cards/{s}.png"
];

var REF = {};              /* card -> hash, built from card art */
var REF_KEY = "chaosRefHashes_v18";
var refState = { done:0, total:0, failed:0, running:false, why:null };

/* Same fingerprint as the screenshot crop: the centre square of
   the artwork, so both sides see the same shape. */

/* Compare whole card to whole card.

   Both the screenshot card and the reference image get squashed into
   the same GW x GH grid of average colour, so the two descriptions
   cover the same thing regardless of the source resolution or aspect.
   Comparing square crops was the earlier mistake: a square taken from
   a portrait card keeps a different slice depending on the source
   shape, so the two sides were never describing the same region. */
var GW = 24, GH = 32;
var CARD_ASPECT = 0.81;

/* Which part of the in-game card is artwork, as fractions of the card
   box. Outside this is frame, elixir drop and level banner. */
var ART_X0 = 0.07, ART_X1 = 0.93, ART_Y0 = 0.04, ART_Y1 = 0.76;

/* The elixir drop, as fractions of the card box. */
var EL_X0 = 0.30, EL_X1 = 0.70, EL_Y0 = 0.79, EL_Y1 = 1.00;
var DGW = 14, DGH = 18;

function sampleRGBA(img, x, y, w, h, gw, gh){
  var c=document.createElement("canvas"); c.width=gw; c.height=gh;
  var g=c.getContext("2d",{willReadFrequently:true});
  g.clearRect(0,0,gw,gh);
  g.drawImage(img, x, y, w, h, 0, 0, gw, gh);
  return g.getImageData(0,0,gw,gh).data;
}

/* ── artwork descriptors ───────────────────────────────────────
   Three independent views of the same crop. Pixel colour catches
   palette, edges catch shape, and the row/column profile catches
   layout. Cards that fool one rarely fool all three. */
function describe(d, withMask){
  var px=[], mask=[], lum=[];
  for(var i=0;i<GW*GH;i++){
    var r=d[i*4], g=d[i*4+1], b=d[i*4+2], a=d[i*4+3];
    px.push(r,g,b);
    lum.push(0.299*r + 0.587*g + 0.114*b);
    if(withMask) mask.push(a > 140 ? 1 : 0);
  }
  /* edge strength per cell */
  var edge=[];
  for(var y=0;y<GH;y++){
    for(var x=0;x<GW;x++){
      var i0=y*GW+x;
      var gx = (x<GW-1 ? lum[i0+1] : lum[i0]) - lum[i0];
      var gy = (y<GH-1 ? lum[i0+GW] : lum[i0]) - lum[i0];
      edge.push(Math.sqrt(gx*gx + gy*gy));
    }
  }
  return { p:px, m:withMask?mask:null, e:edge, l:lum };
}

function refSig(img){
  return describe(sampleRGBA(img, 0, 0, img.naturalWidth, img.naturalHeight, GW, GH), true);
}
function shotSig(img, x, y, w, h){
  return describe(sampleRGBA(img, x, y, w, h, GW, GH), false);
}

/* Mean-corrected colour difference over the masked cells. */
function colourDist(shot, ref){
  var n=0, i, k, sm=[0,0,0], rm=[0,0,0];
  for(i=0;i<GW*GH;i++){
    if(!ref.m[i]) continue;
    n++;
    for(k=0;k<3;k++){ sm[k]+=shot.p[i*3+k]; rm[k]+=ref.p[i*3+k]; }
  }
  if(n<40) return 1e9;
  for(k=0;k<3;k++){ sm[k]/=n; rm[k]/=n; }
  var s=0;
  for(i=0;i<GW*GH;i++){
    if(!ref.m[i]) continue;
    for(k=0;k<3;k++){
      var d=(shot.p[i*3+k]-sm[k])-(ref.p[i*3+k]-rm[k]);
      s+=d*d;
    }
  }
  return Math.sqrt(s/(n*3));
}

/* Edge maps, each normalised so overall contrast does not matter. */
function edgeDist(shot, ref){
  var n=0,i,se=0,re=0;
  for(i=0;i<GW*GH;i++){ if(!ref.m[i]) continue; n++; se+=shot.e[i]; re+=ref.e[i]; }
  if(n<40) return 1e9;
  se=(se/n)||1; re=(re/n)||1;
  var s=0;
  for(i=0;i<GW*GH;i++){
    if(!ref.m[i]) continue;
    var d=(shot.e[i]/se)-(ref.e[i]/re);
    s+=d*d;
  }
  return Math.sqrt(s/n)*40;
}

/* Where the bright and dark bands sit, row by row and column by
   column. Cheap, and good at separating similar palettes. */
function profileDist(shot, ref){
  var rows=[[],[]], cols=[[],[]], x, y, i, n;
  for(y=0;y<GH;y++){
    var a=0,b=0,c=0;
    for(x=0;x<GW;x++){ i=y*GW+x; if(!ref.m[i]) continue; a+=shot.l[i]; b+=ref.l[i]; c++; }
    if(c){ rows[0].push(a/c); rows[1].push(b/c); }
  }
  for(x=0;x<GW;x++){
    var a2=0,b2=0,c2=0;
    for(y=0;y<GH;y++){ i=y*GW+x; if(!ref.m[i]) continue; a2+=shot.l[i]; b2+=ref.l[i]; c2++; }
    if(c2){ cols[0].push(a2/c2); cols[1].push(b2/c2); }
  }
  function cmp(u,v){
    if(!u.length) return 0;
    var mu=0,mv=0,k;
    for(k=0;k<u.length;k++){ mu+=u[k]; mv+=v[k]; }
    mu/=u.length; mv/=v.length;
    var s=0;
    for(k=0;k<u.length;k++){ var d=(u[k]-mu)-(v[k]-mv); s+=d*d; }
    return Math.sqrt(s/u.length);
  }
  return (cmp(rows[0],rows[1]) + cmp(cols[0],cols[1])) / 2;
}

function artScore(shot, ref){
  return colourDist(shot,ref) + edgeDist(shot,ref)*0.8 + profileDist(shot,ref)*0.6;
}

/* Comparing two screenshot crops, no mask needed. */
function shotDist(a,b){
  var s=0, n=GW*GH*3;
  for(var i=0;i<n;i++){ var d=a.p[i]-b.p[i]; s+=d*d; }
  return Math.sqrt(s/n);
}

/* ── elixir digit ──────────────────────────────────────────────
   No OCR and no redrawn fonts. The app collects real digit crops
   from your own screenshots: whenever a card is confirmed, its cost
   is known, so the digit is filed under that cost. */
var DIG_KEY = "chaosElixirDigits_v1";
var DIGLIB = (function(){
  try { return JSON.parse(localStorage.getItem(DIG_KEY)) || {}; }
  catch(e){ return {}; }
})();
function saveDigits(){
  try { localStorage.setItem(DIG_KEY, JSON.stringify(DIGLIB)); } catch(e){}
}

/* White digit against the saturated magenta drop. */
function digitMask(img, cx, cy, w, h){
  var x = cx - w/2 + w*EL_X0, y = cy - h/2 + h*EL_Y0;
  var d = sampleRGBA(img, x, y, w*(EL_X1-EL_X0), h*(EL_Y1-EL_Y0), DGW, DGH);
  var m=[], on=0;
  for(var i=0;i<DGW*DGH;i++){
    var r=d[i*4], g=d[i*4+1], b=d[i*4+2];
    var white = r>165 && g>150 && b>165 && Math.abs(r-b)<70;
    m.push(white?1:0); if(white) on++;
  }
  if(on < 6 || on > DGW*DGH*0.62) return null;
  return m;
}
function maskDist(a,b){
  var diff=0;
  for(var i=0;i<a.length;i++) if(a[i]!==b[i]) diff++;
  return diff/a.length;
}

/* Best cost for this digit, or null when the library cannot say. */
function readCost(mask){
  if(!mask) return null;
  var best=null, bd=1e9, second=1e9;
  for(var cst in DIGLIB){
    if(!DIGLIB.hasOwnProperty(cst)) continue;
    var arr=DIGLIB[cst];
    for(var i=0;i<arr.length;i++){
      var d=maskDist(mask, arr[i]);
      if(d<bd){ second=bd; bd=d; best=+cst; }
      else if(d<second) second=d;
    }
  }
  if(best===null) return null;
  if(bd > 0.22) return null;              /* nothing close enough */
  if(second - bd < 0.05) return null;     /* two costs equally close */
  return best;
}

function learnDigit(cost, mask){
  if(!mask || !cost) return;
  var k=String(cost);
  if(!DIGLIB[k]) DIGLIB[k]=[];
  for(var i=0;i<DIGLIB[k].length;i++) if(maskDist(mask, DIGLIB[k][i]) < 0.05) return;
  DIGLIB[k].push(mask);
  if(DIGLIB[k].length > 8) DIGLIB[k].shift();
  saveDigits();
}

/* ── one recognition path ──────────────────────────────────────── */
function recognise(cx, cy, w, hh){
  function crop(kx, ky){
    var w2=w*kx, h2=hh*ky;
    var x = cx - w2/2 + w2*ART_X0;
    var y = cy - h2/2 + h2*ART_Y0;
    return shotSig(S.img, x, y, w2*(ART_X1-ART_X0), h2*(ART_Y1-ART_Y0));
  }
  var mySig = crop(1,1);
  var dmask = digitMask(S.img, cx, cy, w, hh);
  var cost  = readCost(dmask);

  /* Screenshot library: crops of cards you have already confirmed,
     taken from your own screenshots. Same frame, same device, same
     rendering, so this is the closest thing to like-for-like. */
  var seen = {};
  for(var k in S.lib){
    if(!S.lib.hasOwnProperty(k)) continue;
    var bestSeen = 1e9;
    for(var i=0;i<S.lib[k].length;i++){
      var e=S.lib[k][i];
      if(e && e.p) bestSeen = Math.min(bestSeen, shotDist(mySig, e));
    }
    if(bestSeen < 1e9) seen[k] = bestSeen;
  }
  /* a very close screenshot match is decisive on its own */
  var sureName=null, sureD=1e9;
  for(var sn in seen){ if(seen[sn]<sureD){ sureD=seen[sn]; sureName=sn; } }
  if(sureName && sureD < 26){
    return { sig:mySig, dmask:dmask, cost:cost, name:sureName,
             ranked:[sureName], conf:1, scores:{}, why:"screenshot" };
  }

  /* cost is a hard filter when it read cleanly, otherwise everything */
  var pool = Object.keys(REF).filter(function(nm){
    return cost === null || COST[nm] === cost;
  });
  if(pool.length < 2) pool = Object.keys(REF);
  Object.keys(seen).forEach(function(nm){ if(pool.indexOf(nm)===-1) pool.push(nm); });

  var scores={}, artOnly={};
  [[1,1],[0.93,0.93],[1.07,1.07],[1,0.93],[1,1.07]].forEach(function(kk){
    var sg = crop(kk[0], kk[1]);
    pool.forEach(function(nm){
      if(!REF[nm]) return;
      var d = artScore(sg, REF[nm]);
      if(artOnly[nm]===undefined || d<artOnly[nm]) artOnly[nm]=d;
    });
  });
  pool.forEach(function(nm){
    var a = artOnly[nm]===undefined ? 999 : artOnly[nm];
    /* a screenshot we have seen before pulls that card sharply in */
    var s = seen[nm]===undefined ? null : seen[nm];
    scores[nm] = (s===null) ? a : Math.min(a, s*0.55);
  });

  var ranked = pool.sort(function(a,b){ return scores[a]-scores[b]; });
  var conf = 0;
  if(ranked.length > 1){
    var g = scores[ranked[1]] - scores[ranked[0]];
    conf = Math.max(0, Math.min(1, g / (scores[ranked[0]]*0.5 + 1)));
  }
  return { sig:mySig, dmask:dmask, cost:cost, name:ranked[0]||null,
           ranked:ranked.slice(0,8), conf:conf, scores:scores,
           pool:pool.length, why:"art" };
}

function loadRefs(cb){
  /* Anyone who asks while loading is already under way gets queued.
     Returning early without calling back was leaving the scan with
     nothing to do, which looked like the matcher failing. */
  if (refState.running){ if(cb) refWaiting.push(cb); return; }
  if (Object.keys(REF).length){ if(cb) cb(); return; }
  try {
    var cached = JSON.parse(localStorage.getItem(REF_KEY));
    if (cached && Object.keys(cached).length) {
      REF = cached;
      refState.done = Object.keys(REF).length;
      refState.total = refState.done;
      cb(); return;
    }
  } catch(e){}

  refState.running = true;
  var names = Object.keys(SLUG);
  refState.total = names.length;

  names.forEach(function(name){
    var i = 0;
    function attempt(){
      if (i >= ART.length){
        refState.failed++;
        refState.why = refState.why || ("404: cards/"+SLUG[name]+".png");
        tick(); return;
      }
      var img = new Image();
      var url = ART[i].replace("{s}", SLUG[name]);
      /* same-origin images need no CORS attribute, and asking for one
         makes the load fail if the host does not answer with it */
      if (/^https?:/.test(url)) img.crossOrigin = "anonymous";
      img.onload = function(){
        try { REF[name] = refSig(img); }
        catch(err){ refState.failed++; refState.why = refState.why || ("read: "+err.message); tick(); return; }   /* tainted canvas */
        tick();
      };
      img.onerror = function(){ i++; attempt(); };
      img.src = url;
    }
    attempt();
  });

  function tick(){
    refState.done++;
    if (refState.done >= refState.total){
      refState.running = false;
      try { localStorage.setItem(REF_KEY, JSON.stringify(REF)); } catch(e){}
      finishRefs(cb);
    }
  }
}


/* Elixir cost of every pool card. The number is printed on the card,

"Heal Spirit":1,"Witch":5,"Mortar":4,"Firecracker":3,"Zappies":4,"Executioner":5,

"Inferno Dragon":4,"Wizard":5,"Hunter":4,"Furnace":4,"P.E.K.K.A":7,"Elite Barbarians":6,

function toggle(a,n,max){ var i=a.indexOf(n); if(i!==-1) a.splice(i,1); else if(a.length<max) a.push(n); }

/* Share of the three modifiers at each band. */
function share(c){
  if(!c.common) return [{c:"#33343F", pct:1, t:"?"}];
  var count={}, col={};
  R.forEach(function(r){ var b=band(c[r].v); count[b.t]=(count[b.t]||0)+1; col[b.t]=b.c; });
  return Object.keys(count).sort(function(a,b){
      return BANDS.findIndex(function(x){return x.t===a;}) - BANDS.findIndex(function(x){return x.t===b;});
    }).map(function(t){ return {t:t, c:col[t], pct:count[t]/3}; });
}
function tbar(c, margin){
  return '<div class="tbar" style="margin:'+(margin||"0 16px 10px")+'">'
    + share(c).map(function(s){
        return '<div style="width:'+(s.pct*100)+'%;background:'+s.c+'"></div>';
      }).join("") + '</div>';
}

function diagBlock(){

function vScan(){
  var h = '<label class="cta">Load screenshot'
    + '<input type="file" accept="image/*" id="file" style="display:none"></label>';
  if(!S.img) return h + '<div class="meta">Screenshot the card pick screen. '
    + 'It reads the three cards and ranks them.</div>';

  var known = S.taps.filter(function(t){ return t.name; });
  if(known.length){
    var rk = known.map(function(t){ return byName(t.name); })
                  .sort(function(a,b){ return b.avg-a.avg; });
    var lowest = S.taps.filter(function(t){return t.name;})
                       .reduce(function(a,t){ return Math.min(a, t.conf===undefined?1:t.conf); }, 1);
    var costs = S.taps.map(function(t){ return t.cost || "?"; }).join("  ");
    h += '<div class="eyebrow">Best to worst &middot; tap a name to correct'
      + (lowest < 0.25 ? ' &middot; low confidence' : '') + '</div>'
      + '<div class="meta" style="padding:0 16px 10px">elixir read: '+esc(costs)+'</div>'
      + '<div class="list">'
      + rk.map(function(c,i){ return verdict(c, i===0 && rk.length>1); }).join("") + '</div>';
  }

  if(S.pending !== null){
    var t = S.taps[S.pending];
    var shortlist = (t.cands && t.cands.length) ? t.cands : [];
    var q = S.lq.toLowerCase();
    var listed = q
      ? CARDS.filter(function(c){ return c.card.toLowerCase().indexOf(q)!==-1; })
             .map(function(c){ return c.card; }).slice(0,20)
      : shortlist;
    h += '<div class="ask">'
      + '<div class="askH">Closest matches</div>'
      + '<div class="grid">'
      + listed.map(function(nm){
          return '<button data-learn="'+esc(nm)+'">'
            + (SLUG[nm] ? '<img src="cards/'+SLUG[nm]+'.png" alt="">' : "")
            + '<span>'+esc(nm)+'</span></button>';
        }).join("")
      + '</div>'
      + '<input class="srch" id="lq" placeholder="Or search all cards" value="'+esc(S.lq)+'">'
      + '<button class="ghost" data-skip="1">Cancel</button></div>';
  }

  h += '<div class="wrapOuter"><div id="wrap"><img id="shot" src="'+S.img.src+'" alt="">'
    + '<div class="mk" id="mk"></div></div></div>'
    + '<button class="ghost" data-reset="1">New screenshot</button>';
  var r=Object.keys(REF).length;
  if (r < refState.total){
    h += '<div class="meta">card art '+r+'/'+refState.total
      + (refState.failed?' &middot; '+refState.failed+' failed':'')
      + (refState.why?' &middot; '+esc(refState.why):'') + '</div>';
  }
  return h;
}

function readSlots(){
  S.taps = SLOTS.map(function(s){
    var w  = S.img.naturalWidth * s.w;
    var hh = w / CARD_ASPECT;
    var cx = S.img.naturalWidth * s.x;
    var cy = S.img.naturalHeight * s.y;
    var r = recognise(cx, cy, w, hh);
    /* a confident read teaches the digit library its own cost */
    if(r.name && r.conf > 0.35 && COST[r.name]) learnDigit(COST[r.name], r.dmask);
    return { x:cx, y:cy, w:w, h:hh, size:w, sig:r.sig, dmask:r.dmask,
             name:r.name, cands:r.ranked, conf:r.conf, cost:r.cost,
             scores:r.scores, why:r.why, pool:r.pool };
  });
  nextUnknown();
}
/* Only set by tapping a result to correct it. */
function nextUnknown(){
  S.pending=null;
  for(var i=0;i<S.taps.length;i++)
    if(!S.taps[i].name && S.taps[i].asked){ S.pending=i; S.lq=""; return; }
}

function vCards(){
  return '<input class="srch" id="q" placeholder="Search cards" value="'+esc(S.q)+'">'
    + '<div class="list">'+filtered().map(function(c){
        return item(c, S.deck.indexOf(c.card)!==-1); }).join("")+'</div>'
    + '<div class="key">'+BANDS.map(function(b){
        return '<span><i style="background:'+b.c+'"></i>'+b.t+' '+b.n+'</span>';
      }).join("")+'</div>'
    + '<div class="meta">Ratings from RoyaleAPI, based on real win rates.</div>';
}

function vDeck(){
  if(!S.deck.length) return '<div class="meta" style="padding-top:30px">Add cards from the Cards tab.</div>';
  var cs=S.deck.map(byName).filter(function(c){ return c.common; });
  if(!cs.length) return '<div class="meta" style="padding-top:30px">No modifier data for those cards.</div>';
  var avg=cs.reduce(function(a,c){ return a+c.avg; },0)/cs.length;
  var odds=WAVES.map(function(w){
    var pw=0;
    R.forEach(function(r){
      if(!w[r]) return;
      pw += w[r] * (cs.filter(function(c){ return !isGood(c[r].v); }).length/cs.length);
    });
    return {n:w.n, p:1-pw*pw};
  });
  return '<div class="stat"><div><div class="big">'+Math.round(avg)+'</div>'
    + '<div class="statLbl">deck rating</div></div>'
    + '<div style="text-align:right"><div class="big">'+S.deck.length+'</div>'
    + '<div class="statLbl">of 8</div></div></div>'
    + '<div class="eyebrow">Odds of a strong offer</div>'
    + '<div style="border-top:1px solid var(--line)">'
    + odds.map(function(w){
        return '<div class="wave"><span class="wn">'+w.n+'</span>'
          + '<div class="trk"><div class="fil" style="width:'+(w.p*100)+'%"></div></div>'
          + '<span class="wp">'+Math.round(w.p*100)+'</span></div>';
      }).join("")+'</div>'
    + '<div class="chips">'+S.deck.map(function(n){
        return '<button data-toggle="'+esc(n)+'">'+esc(n)+' \u00d7</button>';
      }).join("")+'</div>';
}

function render(){
  var el=document.getElementById("view"), af=document.activeElement;
  var fid=(af&&(af.id==="q"||af.id==="lq"))?af.id:null;
  var car=fid?af.selectionStart:null;
  el.innerHTML = S.tab==="scan" ? vScan() : S.tab==="cards" ? vCards() : vDeck();
  document.querySelectorAll(".tabs button").forEach(function(b){
    b.setAttribute("aria-selected", b.dataset.tab===S.tab ? "true":"false"); });
  if(fid){ var f=document.getElementById(fid); if(f){ f.focus(); f.setSelectionRange(car,car); } }
  marks();
}

function marks(){
  var box=document.getElementById("mk"), shot=document.getElementById("shot");
  if(!box||!shot||!S.img) return;
  if(!shot.clientWidth){ shot.onload=marks; return; }
  var sc=shot.clientWidth/S.img.naturalWidth;
  box.innerHTML = S.taps.map(function(t,i){
    var s=t.size*sc;
    return '<div style="left:'+(t.x*sc)+'px;top:'+(t.y*sc)+'px;width:'+s+'px;height:'+s+'px">'
      + '<b>'+(t.name?esc(t.name):(i+1))+'</b></div>';
  }).join("");
}

document.querySelector(".tabs").addEventListener("click",function(e){
  var b=e.target.closest("button[data-tab]"); if(!b) return;
  S.tab=b.dataset.tab; S.open=null; render();
});
document.getElementById("view").addEventListener("change",function(e){
  if(e.target.id!=="file") return;
  var f=e.target.files&&e.target.files[0]; if(!f) return;
  var i=new Image();
  i.onload=function(){
    S.img=i; S.taps=[]; S.pending=null;
    render();
    loadRefs(function(){ if(S.img){ readSlots(); render(); } });
  };
  i.src=URL.createObjectURL(f);
});
document.getElementById("view").addEventListener("click",function(e){
  var fx=e.target.closest("[data-fix]");
  if(fx && S.tab==="scan"){
    var want=fx.dataset.fix;
    for(var k=0;k<S.taps.length;k++){
      if(S.taps[k].name===want){ S.taps[k].name=null; S.taps[k].asked=true; break; }
    }
    nextUnknown(); render(); return;
  }
  var l=e.target.closest("[data-learn]");
  if(l){ var n=l.dataset.learn, t=S.taps[S.pending];
    if(!S.lib[n]) S.lib[n]=[];
    S.lib[n].push(t.sig);
    if(COST[n]) learnDigit(COST[n], t.dmask);
    if(S.lib[n].length>6) S.lib[n].shift();
    saveLib(S.lib);
    t.name=n; nextUnknown(); render(); return; }
  if(e.target.closest("[data-diag]")){ S.diag=!S.diag; render(); return; }
  if(e.target.closest("[data-skip]")){
    S.taps[S.pending].asked=false; S.pending=null; render(); return; }
  if(e.target.closest("[data-reset]")){ S.img=null; S.taps=[]; S.pending=null; render(); return; }
  if(e.target.closest("[data-wipe]")){ S.lib={}; saveLib(S.lib); render(); return; }
  var o=e.target.closest("[data-open]");
  if(o){ S.open = S.open===o.dataset.open ? null : o.dataset.open; render(); return; }
  var g=e.target.closest("[data-toggle]");
  if(g){ toggle(S.deck,g.dataset.toggle,8); render(); return; }
});
document.getElementById("view").addEventListener("input",function(e){
  if(e.target.id==="q"){ S.q=e.target.value; render(); }
  if(e.target.id==="lq"){ S.lq=e.target.value; render(); }
});
window.addEventListener("resize",marks);
render();
loadRefs(function(){ if(S.img){ readSlots(); } render(); });
</script>
</body>
</html>
