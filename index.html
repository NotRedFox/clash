<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#101014">
<title>Chaos Draft</title>
<style>
:root{
  --bg:#101014; --surface:#18181E; --line:#26262F; --line2:#33333F;
  --ink:#F0F0F2; --mid:#9A9AA6; --low:#61616E; --acc:#FFD400;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg)}
body{color:var(--ink);
  font:400 15px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  padding:calc(12px + env(safe-area-inset-top)) 0 calc(24px + env(safe-area-inset-bottom));
  max-width:460px;margin:0 auto;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--acc);outline-offset:-2px}

.tabs{display:flex;border-bottom:1px solid var(--line);margin-bottom:2px}
.tabs button{flex:1;min-height:46px;font-size:.72rem;font-weight:700;letter-spacing:.08em;
  text-transform:uppercase;color:var(--low);border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--acc)}

.eyebrow{font-size:.66rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;
  color:var(--low);padding:18px 16px 8px}

.list{border-top:1px solid var(--line)}
.item{border-bottom:1px solid var(--line)}
.item.on{background:var(--surface);box-shadow:inset 3px 0 0 var(--acc)}
.head{display:flex;align-items:center;gap:12px;padding:0 16px;min-height:50px}
.nm{flex:1;min-width:0;text-align:left;font-size:.9rem;font-weight:600;padding:14px 0;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sc{font-size:.9rem;font-weight:800;font-variant-numeric:tabular-nums;min-width:26px;text-align:right}
.add{width:30px;height:30px;flex:none;border:1px solid var(--line2);color:var(--mid);
  font-size:1rem;line-height:1;display:grid;place-items:center}
.add.on{background:var(--acc);border-color:var(--acc);color:#101014;font-weight:800}

.tbar{display:flex;height:5px;margin:0 16px 10px}
.tbar div{height:100%}
.tlab{display:flex;gap:12px;padding:0 16px 12px;font-size:.64rem;color:var(--mid);
  font-variant-numeric:tabular-nums}
.tlab span{display:flex;align-items:center;gap:4px}
.tlab i{width:7px;height:7px;display:block}

.exp{padding:2px 16px 14px;display:flex;flex-direction:column;gap:11px}
.mod{display:grid;grid-template-columns:3px 1fr auto;gap:11px;align-items:start}
.bar{align-self:stretch}
.mr{font-size:.62rem;font-weight:700;letter-spacing:.1em;color:var(--low);text-transform:uppercase}
.me{font-size:.84rem;color:#C9C9D2;margin-top:2px}
.mv{font-size:.78rem;font-weight:700;font-variant-numeric:tabular-nums;color:var(--mid)}

.srch{width:100%;min-height:44px;padding:0 16px;background:var(--surface);border:0;
  border-top:1px solid var(--line);border-bottom:1px solid var(--line);
  color:var(--ink);font:inherit;font-size:.9rem}
.srch:focus{outline:none}
.srch::placeholder{color:var(--low)}

.stat{display:flex;align-items:flex-end;justify-content:space-between;padding:6px 16px 18px}
.big{font-size:2.6rem;font-weight:800;line-height:.9;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.statLbl{font-size:.66rem;letter-spacing:.1em;text-transform:uppercase;color:var(--low)}
.wave{display:grid;grid-template-columns:14px 1fr 34px;gap:11px;align-items:center;
  padding:9px 16px;border-bottom:1px solid var(--line)}
.wn{font-size:.72rem;font-weight:700;color:var(--mid);font-variant-numeric:tabular-nums}
.trk{height:6px;background:var(--surface)}
.fil{height:100%;background:var(--acc);transition:width .25s}
.wp{font-size:.78rem;font-weight:700;text-align:right;font-variant-numeric:tabular-nums}
.chips{display:flex;flex-wrap:wrap;gap:4px;padding:14px 16px}
.chips button{background:var(--surface);border:1px solid var(--line);padding:7px 10px;
  font-size:.75rem;color:var(--mid)}

.pk{border-bottom:1px solid var(--line);padding:14px 16px}
.pk.win{background:var(--surface);box-shadow:inset 3px 0 0 var(--acc)}
.pkTop{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:10px}
.pkNm{font-size:1.05rem;font-weight:700;letter-spacing:-.01em}
.rk{display:inline-block;min-width:20px;margin-right:8px;color:var(--low);
  font-size:.8rem;font-weight:700;font-variant-numeric:tabular-nums}
.pkSc{font-size:1.05rem;font-weight:800;font-variant-numeric:tabular-nums;color:var(--acc)}
.tag{font-size:.6rem;font-weight:800;letter-spacing:.1em;color:var(--acc);display:block;margin-bottom:4px}
.pkMods{display:flex;flex-direction:column;gap:7px}
.pkMod{display:grid;grid-template-columns:3px 1fr auto;gap:10px;align-items:center}

.cta{display:grid;place-items:center;width:100%;min-height:50px;background:var(--acc);
  color:#101014;font-weight:800;font-size:.85rem;letter-spacing:.04em;text-transform:uppercase}
.ghost{display:block;width:100%;min-height:44px;border-top:1px solid var(--line);
  color:var(--mid);font-size:.8rem}
.wrapOuter{text-align:center;padding:8px 0}
#wrap{position:relative;display:inline-block;line-height:0}
#shot{max-height:30vh;max-width:100%;width:auto;display:block}
.mk{position:absolute;inset:0;pointer-events:none}
.mk div{position:absolute;border:2px solid var(--acc);transform:translate(-50%,-50%)}
.mk b{position:absolute;top:-8px;left:-2px;background:var(--acc);color:#101014;
  font-size:.58rem;padding:0 4px;white-space:nowrap}
.ask{border-top:2px solid var(--acc);background:var(--surface)}
.askH{font-size:.8rem;font-weight:700;padding:14px 16px 0}
.opts{max-height:210px;overflow-y:auto}
.opts button{display:block;width:100%;text-align:left;padding:11px 16px;font-size:.85rem;
  border-bottom:1px solid var(--line)}

.meta{font-size:.7rem;color:var(--low);padding:16px}
.key{display:flex;flex-wrap:wrap;gap:10px;padding:16px;font-size:.68rem;color:var(--mid)}
.key span{display:flex;align-items:center;gap:5px}
.key i{width:9px;height:9px;display:block}

@media (max-width:350px){ body{font-size:14px} }
@media (prefers-reduced-motion:reduce){ .fil{transition:none} }
</style>
</head>
<body>

<div class="tabs" role="tablist">
  <button role="tab" data-tab="scan" aria-selected="true">Scan</button>
  <button role="tab" data-tab="cards" aria-selected="false">Cards</button>
  <button role="tab" data-tab="deck" aria-selected="false">Deck</button>
  <button role="tab" data-tab="draft" aria-selected="false">Draft</button>
</div>

<div id="view"></div>

<script>
"use strict";

/* Wave odds from RoyaleAPI. No epics before wave 3. */
var WAVES = [
  {n:1, clock:"2:56", common:.90, rare:.10, epic:0},
  {n:2, clock:"2:11", common:.20, rare:.80, epic:0},
  {n:3, clock:"1:26", common:0,   rare:.50, epic:.50},
  {n:4, clock:"0:26", common:0,   rare:.20, epic:.80},
  {n:5, clock:"OT",   common:0,   rare:0,   epic:1}
];

/* Ratings are RoyaleAPI's, derived from real win rates over
   millions of battles. Bands turn a rating into a letter. */
var BANDS = [
  {min:70, t:"S", c:"#FFD400", n:"Broken"},
  {min:52, t:"A", c:"#FF4B3E", n:"Strong"},
  {min:38, t:"B", c:"#A76BE8", n:"Fine"},
  {min:25, t:"C", c:"#5F6070", n:"Weak"},
  {min:0,  t:"D", c:"#33343F", n:"Dead"}
];
function band(v){ for(var i=0;i<BANDS.length;i++) if(v>=BANDS[i].min) return BANDS[i]; }
function isGood(v){ return v >= 52; }
var R = ["common","rare","epic"];

var RAW = [
["Skeleton Barrel", ["Barry Barrel", 67], ["Big Boned", 85], ["99 Blue Balloons", 66]],
["Royal Hogs", ["BBQ Season", 81], ["Hog...Riders?", 77], ["Hog Dynasty", 56]],
["Goblin Barrel", ["Cannonball!", 74], ["Double Barrel", 36], ["Muscle Mates", 88]],
["Golem", ["Paint It Pink!", 51], ["Twin Tanks", 73], ["Not Today!", 71]],
["Goblin Hut", ["ALARM!", 37], ["No Party Like a Goblin Party", 75], ["Bombs Away!", 78]],
["Fireball", ["Scorched Earth", 50], ["Stop, Drop & Roll", 68], ["Meteor Shower", 64]],
["Goblin Drill", ["Gum Galore", 85], ["Always Workin'", 37], ["Drill, Baby, Drill!", 58]],
["Suspicious Bush", ["If One Goes, We ALL Go", 50], ["Looks Fine to Me!", 41], ["Always Look in the Bush!", 83]],
["Skeleton Army", ["Restless Dead", 40], ["Skeletrooper Brigade", 88], ["Undying Hordes", 43]],
["Barbarian Barrel", ["Just Keep Rollin'", 42], ["Barrel Barrel Barrel", 47], ["Barbarian Recruits", 80]],
["Vines", ["All Tangled Up", 47], ["Jungle Fever", 45], ["Entangling Endeavor", 77]],
["Goblin Demolisher", ["Go the Distance", 87], ["Skippin' Bombs Like Stones", 42], ["Explosions Everywhere", 39]],
["Poison", ["The Poison & the Hare", 59], ["Bigger & Better", 67], ["No Escape", 41]],
["Knight", ["Truly of the Round Table", 71], ["An Absolute Stunner", 36], ["Not This Guy Again!", 52]],
["Barbarian Hut", ["Best of Both Barbs", 43], ["Extra Elitists", 54], ["Well, ****!", 60]],
["Musketeer", ["Shots Fired!", 54], ["Realllllllllllly Long Range", 67], ["#Girlbosses", 34]],
["Ronin", ["Cool It!", 38], ["Monastery Training", 71], ["Way of the Blade", 40]],
["Electro Wizard", ["Zip Zap Zop", 42], ["Quadruple Ruple", 65], ["Hands of Lightning", 42]],
["The Log", ["goL ehT gnaremooB", 45], ["The Loooooooog", 26], ["Chop! Chop!", 76]],
["Rascals", ["Just a Giggle of Girls", 42], ["Gorgeous Groupies", 43], ["Callin' in the Bosses", 56]],
["Firecracker", ["Jump! Jump! Jump Around!", 43], ["Furious Fireworks", 46], ["A Pack of the Clones", 52]],
["Berserker", ["Beatdown Boulevard", 35], ["Don't Get in Her Way", 69], ["Mutilation Meditation", 34]],
["Arrows", ["Block Out the Sun", 52], ["Set Their Tower Ablaze", 27], ["Reign of Arrows", 59]],
["Baby Dragon", ["Baby Fly, Fly, Fly", 29], ["Gargantuan Flameballs", 68], ["Baby's Got a Baby!", 40]],
["Graveyard", ["Undead Again", 24], ["Go! Go! Go!", 47], ["They're Skeverywhere!", 64]],
["Mega Knight", ["Power Jump", 33], ["Ultra Mega Power Jump", 67], ["Mega PUNCH", 34]],
["Zappies", ["Zippy Zappies", 52], ["Zap Zep Zip Zop & Zup", 33], ["The Sparky Sparkles!", 47]],
["Giant", ["2 Fast 4 You", 39], ["Large & In Charge", 60], ["World's Largest Barrel", 29]],
["Wizard", ["Fury o' Flames", 37], ["INCOMING!", 47], ["Zap! Ouch! Brrr!", 40]],
["Goblin Giant", ["Javelin Junkies", 22], ["Mean & Green", 44], ["Elec-trick-tians", 55]],
["Executioner", ["Stronger Than Ever", 51], ["Let's Axe a Dud!", 32], ["Axed with the Wind", 36]],
["Flying Machine", ["Bada Bing, Bada Boom!", 50], ["Paragob Pursuit", 30], ["Beam Me Up, Barb", 39]],
["Tombstone", ["Double Dead", 32], ["Spawned Siege", 34], ["Tomb of the King", 48]],
["Bandit", ["Long Distance Runner", 33], ["Dashing Spree", 24], ["Echo Dash", 55]],
["P.E.K.K.A", ["2 Fast 2 Ferocious", 31], ["Miniature P.E.K.K.As", 36], ["Dig Deep", 44]],
["Witch", ["Speedy Spawn", 37], ["On Guard!", 54], ["Skelebrate Good Times", 19]],
["Night Witch", ["Barely Haunted Bats", 35], ["Purple Please!", 24], ["DUCK...no...BATS!", 51]],
["Inferno Dragon", ["The Burninator", 48], ["Bad Breath", 38], ["Arenageddon", 23]],
["Furnace", ["Never Put Out Your Flame", 37], ["So Many Spirits!", 45], ["Semifunctional Furnace", 25]],
["Princess", ["Quickdraw", 42], ["Royal Ranger", 29], ["Pierce the Tower", 35]],
["Zap", ["E.M.P", 37], ["Storm Strike", 28], ["Gotta Zap 'Em All", 41]],
["Three Musketeers", ["d'Artagnan", 38], ["Last Stand", 18], ["New Recruits", 49]],
["Heal Spirit", ["Free Spirit", 24], ["Giveth and Taketh", 24], ["Spirit Rain", 54]],
["Mortar", ["On the Up & Up", 30], ["Be the Boulder", 53], ["A Mystical Mystery", 19]],
["Tesla", ["Arc Reaction", 50], ["Sap Zap", 23], ["Goblinstein's Revenge", 29]],
["Dart Goblin", ["Speedy Goblinez", 40], ["Call Him Darcher", 19], ["Shocking Gum", 36]],
["Electro Spirit", ["Sentient & Spirited", 37], ["Zap, Glorious Zap", 24], ["Don't Look Directly at It", 31]],
["Mother Witch", ["I Double Hog Dare You", 38], ["KA! BOOM!", 20], ["The Mother Curse", 34]],
["Elite Barbarians", ["Rage-Tipped Spears", 26], ["Brothers in Arms and Legs", 20], ["Royal Nesting Barbs", 44]],
["Hunter", ["Shoot Your Shot", 22], ["Ambush", 21], ["Burn Baby Burn!", 46]],
["Rune Giant", ["Stronger & STRONGER", 31], ["Ain't Babies, That's for Sure", 36], ["See Ya, Sucka!", 22]],
["Ice Spirit", ["Ice, Ice, Ice, Baby!", 34], ["To Thaw or Not to Thaw", 26], ["No Finger Left Unfrozen", 29]],
["Inferno Tower", ["Don't Hold Back", 28], ["I Triple Dog Dare You", 22], ["The Unbalanced Beam", 37]],
["Royal Delivery", ["Evo Delivery", 20], ["Here, There, Anywhere!", 31], ["Random Delivery", 34]],
["Ram Rider", ["CHAAAARGE!", 21], ["Tie Me Down", 27], ["Battering Net", 36]],
["Ice Wizard", ["Splashy Entrance", 21], ["Inspired by Snails", 19], ["Simon Says: Freeze!", 33]],
["Rocket", ["Bouncing Bomb", 28], ["Party On, Goblin!", 25], ["Rocket, Destroyer of Towers", 20]],
["Royal Giant", ["Splish Splash Splosh", 17], ["Look Out, Over There!", 31], ["Let Loose the Hogs of War", 24]],
["Lava Hound", ["Super Troops", 24], ["Burn Book Business", 20], ["Like Bunnies", 27]],
["Elixir Golem", ["Gooey Golemites", 20], ["Give Some, Get Some", 32], ["From Blob to Glob", 17]],
["Dark Prince", ["Swift Charge", 23], ["Shake It Off", 17], ["Darling, I'm a Nightmare", 29]],
["X-Bow", ["Radical Range", 29], ["Magically Miniscule", 8], ["Shockingly Short", 29]],
["Valkyrie", ["More Momentum", 19], ["She's the Axpert", 27], ["Spin To Win", 20]],
["Fisherman", ["Tough as Scales", 28], ["Down to Earth", 15], ["Hook Me Baby One More Time", 20]],
["Rage", ["Raging Rage", 22], ["Just Superhero Stuff", 20], ["Keep Calm & Rage On", 21]],
["Giant Snowball", ["Practically Glacial", 20], ["Get Outta Here!", 15], ["Snowball Fight!", 26]]
];
var UNCAT = ["Bomber", "Mini P.E.K.K.A", "Prince", "Hog Rider", "Fire Spirit", "Miner", "Skeletons", "Goblins"];


var CARDS = RAW.map(function(x){
  return {
    card:x[0],
    common:{n:x[1][0], v:x[1][1]},
    rare:  {n:x[2][0], v:x[2][1]},
    epic:  {n:x[3][0], v:x[3][1]},
    avg:(x[1][1]+x[2][1]+x[3][1])/3
  };
});
UNCAT.forEach(function(n){ CARDS.push({card:n, common:null, avg:0}); });
CARDS.sort(function(a,b){ return b.avg - a.avg; });

function byName(n){ for(var i=0;i<CARDS.length;i++) if(CARDS[i].card===n) return CARDS[i]; return null; }
function esc(s){ return String(s).replace(/[&<>"]/g,function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]; }); }

/* dHash: shrink crop to 9x8 grey, compare each pixel to its right
   neighbour. 64 bits of brightness shape, resolution independent. */
var HW=9, HH=8, THRESH=12, LIB_KEY="chaosCardHashes";

/* The card row sits in the same place on every screenshot. */
var SLOTS = [
  {x:0.213, y:0.531, w:0.25},
  {x:0.500, y:0.531, w:0.25},
  {x:0.787, y:0.531, w:0.25}
];

function loadLib(){ try{ return JSON.parse(localStorage.getItem(LIB_KEY))||{}; }catch(e){ return {}; } }
function saveLib(l){ try{ localStorage.setItem(LIB_KEY, JSON.stringify(l)); }catch(e){} }
function libCount(l){ var n=0; for(var k in l) if(l.hasOwnProperty(k)) n+=l[k].length; return n; }

function hashCrop(img,cx,cy,size){
  var c=document.createElement("canvas"); c.width=HW; c.height=HH;
  var x=c.getContext("2d",{willReadFrequently:true}), h=size/2;
  x.drawImage(img,cx-h,cy-h,size,size,0,0,HW,HH);
  var d=x.getImageData(0,0,HW,HH).data, g=[];
  for(var i=0;i<HW*HH;i++) g.push(.299*d[i*4]+.587*d[i*4+1]+.114*d[i*4+2]);
  var b="";
  for(var y=0;y<HH;y++) for(var q=0;q<HW-1;q++) b += g[y*HW+q] < g[y*HW+q+1] ? "1":"0";
  return b;
}
function ham(a,b){ var n=0; for(var i=0;i<a.length;i++) if(a[i]!==b[i]) n++; return n; }
function identify(h,lib){
  var best=null,bd=999;
  for(var k in lib){ if(!lib.hasOwnProperty(k)) continue;
    for(var i=0;i<lib[k].length;i++){ var d=ham(h,lib[k][i]); if(d<bd){bd=d;best=k;} } }
  return bd<=THRESH ? best : null;
}

var S = { tab:"scan", deck:[], offer:[], open:null, q:"",
          img:null, taps:[], pending:null, lib:loadLib(), lq:"" };

function toggle(a,n,max){ var i=a.indexOf(n); if(i!==-1) a.splice(i,1); else if(a.length<max) a.push(n); }

/* Share of the three modifiers at each band. */
function share(c){
  if(!c.common) return [{c:"#33343F", pct:1, t:"?"}];
  var count={}, col={};
  R.forEach(function(r){ var b=band(c[r].v); count[b.t]=(count[b.t]||0)+1; col[b.t]=b.c; });
  return Object.keys(count).sort(function(a,b){
      return BANDS.findIndex(function(x){return x.t===a;}) - BANDS.findIndex(function(x){return x.t===b;});
    }).map(function(t){ return {t:t, c:col[t], pct:count[t]/3}; });
}
function tbar(c, margin){
  return '<div class="tbar" style="margin:'+(margin||"0 16px 10px")+'">'
    + share(c).map(function(s){
        return '<div style="width:'+(s.pct*100)+'%;background:'+s.c+'"></div>';
      }).join("") + '</div>';
}

function item(c,sel){
  if(!c.common){
    return '<div class="item"><div class="head"><span class="nm">'+esc(c.card)+'</span>'
      + '<span class="sc" style="color:var(--low)">?</span></div></div>';
  }
  var exp = S.open===c.card
    ? '<div class="exp">' + R.map(function(r){
        var b=band(c[r].v);
        return '<div class="mod"><span class="bar" style="background:'+b.c+'"></span>'
          + '<div><div class="mr">'+r+'</div><div class="me">'+esc(c[r].n)+'</div></div>'
          + '<span class="mv">'+c[r].v+'</span></div>';
      }).join("") + '</div>'
    : "";
  return '<div class="item'+(sel?" on":"")+'"><div class="head">'
    + '<button class="nm" data-open="'+esc(c.card)+'">'+esc(c.card)+'</button>'
    + '<span class="sc" style="color:'+band(c.avg).c+'">'+Math.round(c.avg)+'</span>'
    + '<button class="add'+(sel?" on":"")+'" data-toggle="'+esc(c.card)+'">'
    + (sel?"\u2713":"+")+'</button></div>'
    + tbar(c) + '<div class="tlab">' + share(c).map(function(s){
        return '<span><i style="background:'+s.c+'"></i>'+Math.round(s.pct*100)+'% '+s.t+'</span>';
      }).join("") + '</div>' + exp + '</div>';
}

function filtered(){
  var q=S.q.toLowerCase();
  return CARDS.filter(function(c){ return c.card.toLowerCase().indexOf(q)!==-1; });
}

function verdict(c,win,rank){
  if(!c.common){
    return '<div class="pk"><div class="pkTop"><span class="pkNm">'
      + (rank?'<span class="rk">'+rank+'</span>':"")+esc(c.card)+'</span>'
      + '<span class="pkSc" style="color:var(--low)">?</span></div>'
      + '<div class="me">No modifier data catalogued yet</div></div>';
  }
  return '<div class="pk'+(win?" win":"")+'">'
    + (win?'<span class="tag">TAKE THIS</span>':"")
    + '<div class="pkTop"><span class="pkNm">'
    + (rank?'<span class="rk">'+rank+'</span>':"")+esc(c.card)+'</span>'
    + '<span class="pkSc">'+Math.round(c.avg)+'</span></div>'
    + tbar(c,"0 0 12px") + '<div class="pkMods">'
    + R.map(function(r){
        var b=band(c[r].v);
        return '<div class="pkMod"><span class="bar" style="background:'+b.c
          + ';height:22px"></span><span class="me" style="margin:0">'
          + '<span class="mr">'+r+'</span> '+esc(c[r].n)+'</span>'
          + '<span class="mv">'+c[r].v+'</span></div>';
      }).join("") + '</div></div>';
}

function vScan(){
  var h = '<label class="cta">Load screenshot'
    + '<input type="file" accept="image/*" id="file" style="display:none"></label>';
  if(!S.img) return h + '<div class="meta">Screenshot the card pick screen. '
    + 'It reads the three cards and ranks them.</div>';

  if(S.pending !== null){
    h += '<div class="ask"><div class="askH">Card '+(S.pending+1)+' of 3. Which is it?</div>'
      + '<input class="srch" id="lq" placeholder="Search" value="'+esc(S.lq)+'" style="margin-top:10px">'
      + '<div class="opts">'
      + CARDS.filter(function(c){ return c.card.toLowerCase().indexOf(S.lq.toLowerCase())!==-1; })
             .map(function(c){ return '<button data-learn="'+esc(c.card)+'">'+esc(c.card)+'</button>'; })
             .join("")
      + '</div><button class="ghost" data-skip="1">Skip</button></div>';
  }

  var known = S.taps.filter(function(t){ return t.name; });
  if(known.length){
    var rk = known.map(function(t){ return byName(t.name); })
                  .sort(function(a,b){ return b.avg-a.avg; });
    h += '<div class="eyebrow">Best to worst</div><div class="list">'
      + rk.map(function(c,i){ return verdict(c, i===0 && rk.length>1); }).join("") + '</div>';
  }

  h += '<div class="wrapOuter"><div id="wrap"><img id="shot" src="'+S.img.src+'" alt="">'
    + '<div class="mk" id="mk"></div></div></div>'
    + '<button class="ghost" data-reset="1">New screenshot</button>';
  var n=libCount(S.lib);
  h += '<div class="meta">'+n+' learned'
    + (n?' &middot; <button data-wipe="1" style="color:var(--low);text-decoration:underline;padding:0">reset</button>':'')
    + '</div>';
  return h;
}

function readSlots(){
  S.taps = SLOTS.map(function(s){
    var cx=S.img.naturalWidth*s.x, cy=S.img.naturalHeight*s.y, size=S.img.naturalWidth*s.w;
    var hash=hashCrop(S.img,cx,cy,size);
    return {x:cx,y:cy,size:size,hash:hash,name:identify(hash,S.lib)};
  });
  nextUnknown();
}
function nextUnknown(){
  S.pending=null;
  for(var i=0;i<S.taps.length;i++)
    if(!S.taps[i].name && !S.taps[i].skipped){ S.pending=i; S.lq=""; return; }
}

function vCards(){
  return '<input class="srch" id="q" placeholder="Search cards" value="'+esc(S.q)+'">'
    + '<div class="list">'+filtered().map(function(c){
        return item(c, S.deck.indexOf(c.card)!==-1); }).join("")+'</div>'
    + '<div class="key">'+BANDS.map(function(b){
        return '<span><i style="background:'+b.c+'"></i>'+b.t+' '+b.n+'</span>';
      }).join("")+'</div>'
    + '<div class="meta">Ratings from RoyaleAPI, based on real win rates.</div>';
}

function vDeck(){
  if(!S.deck.length) return '<div class="meta" style="padding-top:30px">Add cards from the Cards tab.</div>';
  var cs=S.deck.map(byName).filter(function(c){ return c.common; });
  if(!cs.length) return '<div class="meta" style="padding-top:30px">No modifier data for those cards.</div>';
  var avg=cs.reduce(function(a,c){ return a+c.avg; },0)/cs.length;
  var odds=WAVES.map(function(w){
    var pw=0;
    R.forEach(function(r){
      if(!w[r]) return;
      pw += w[r] * (cs.filter(function(c){ return !isGood(c[r].v); }).length/cs.length);
    });
    return {n:w.n, p:1-pw*pw};
  });
  return '<div class="stat"><div><div class="big">'+Math.round(avg)+'</div>'
    + '<div class="statLbl">deck rating</div></div>'
    + '<div style="text-align:right"><div class="big">'+S.deck.length+'</div>'
    + '<div class="statLbl">of 8</div></div></div>'
    + '<div class="eyebrow">Odds of a strong offer</div>'
    + '<div style="border-top:1px solid var(--line)">'
    + odds.map(function(w){
        return '<div class="wave"><span class="wn">'+w.n+'</span>'
          + '<div class="trk"><div class="fil" style="width:'+(w.p*100)+'%"></div></div>'
          + '<span class="wp">'+Math.round(w.p*100)+'</span></div>';
      }).join("")+'</div>'
    + '<div class="chips">'+S.deck.map(function(n){
        return '<button data-toggle="'+esc(n)+'">'+esc(n)+' \u00d7</button>';
      }).join("")+'</div>';
}

function vDraft(){
  var mega = S.offer.length > 3;
  var rk = S.offer.map(byName).sort(function(a,b){ return mega ? a.avg-b.avg : b.avg-a.avg; });
  var h = "";
  if(rk.length){
    h = '<div class="eyebrow">'+(mega?'Worst to best':'Best pick')+'</div><div class="list">'
      + rk.map(function(c,i){
          var top = mega ? (i===rk.length-1) : (i===0 && rk.length>1);
          return verdict(c, top, mega ? (rk.length-i) : 0);
        }).join("")
      + '</div><button class="ghost" id="clear">Clear</button>';
  }
  return h + '<input class="srch" id="q" placeholder="Search cards" value="'+esc(S.q)+'">'
    + '<div class="list">'+filtered().map(function(c){
        return item(c, S.offer.indexOf(c.card)!==-1); }).join("")+'</div>';
}

function render(){
  var el=document.getElementById("view"), af=document.activeElement;
  var fid=(af&&(af.id==="q"||af.id==="lq"))?af.id:null;
  var car=fid?af.selectionStart:null;
  el.innerHTML = S.tab==="scan" ? vScan() : S.tab==="cards" ? vCards()
               : S.tab==="deck" ? vDeck() : vDraft();
  document.querySelectorAll(".tabs button").forEach(function(b){
    b.setAttribute("aria-selected", b.dataset.tab===S.tab ? "true":"false"); });
  if(fid){ var f=document.getElementById(fid); if(f){ f.focus(); f.setSelectionRange(car,car); } }
  marks();
}

function marks(){
  var box=document.getElementById("mk"), shot=document.getElementById("shot");
  if(!box||!shot||!S.img) return;
  if(!shot.clientWidth){ shot.onload=marks; return; }
  var sc=shot.clientWidth/S.img.naturalWidth;
  box.innerHTML = S.taps.map(function(t,i){
    var s=t.size*sc;
    return '<div style="left:'+(t.x*sc)+'px;top:'+(t.y*sc)+'px;width:'+s+'px;height:'+s+'px">'
      + '<b>'+(t.name?esc(t.name):(i+1))+'</b></div>';
  }).join("");
}

document.querySelector(".tabs").addEventListener("click",function(e){
  var b=e.target.closest("button[data-tab]"); if(!b) return;
  S.tab=b.dataset.tab; S.open=null; render();
});
document.getElementById("view").addEventListener("change",function(e){
  if(e.target.id!=="file") return;
  var f=e.target.files&&e.target.files[0]; if(!f) return;
  var i=new Image();
  i.onload=function(){ S.img=i; readSlots(); render(); };
  i.src=URL.createObjectURL(f);
});
document.getElementById("view").addEventListener("click",function(e){
  var l=e.target.closest("[data-learn]");
  if(l){ var n=l.dataset.learn, t=S.taps[S.pending];
    if(!S.lib[n]) S.lib[n]=[];
    S.lib[n].push(t.hash); saveLib(S.lib);
    t.name=n; nextUnknown(); render(); return; }
  if(e.target.closest("[data-skip]")){ S.taps[S.pending].skipped=true; nextUnknown(); render(); return; }
  if(e.target.closest("[data-reset]")){ S.img=null; S.taps=[]; S.pending=null; render(); return; }
  if(e.target.closest("[data-wipe]")){ S.lib={}; saveLib(S.lib); render(); return; }
  var o=e.target.closest("[data-open]");
  if(o){ S.open = S.open===o.dataset.open ? null : o.dataset.open; render(); return; }
  var g=e.target.closest("[data-toggle]");
  if(g){ if(S.tab==="draft") toggle(S.offer,g.dataset.toggle,12);
         else toggle(S.deck,g.dataset.toggle,8);
         render(); return; }
  if(e.target.id==="clear"){ S.offer=[]; render(); }
});
document.getElementById("view").addEventListener("input",function(e){
  if(e.target.id==="q"){ S.q=e.target.value; render(); }
  if(e.target.id==="lq"){ S.lq=e.target.value; render(); }
});
window.addEventListener("resize",marks);
render();
</script>
</body>
</html>
